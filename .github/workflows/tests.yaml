name: "tests"
# No `paths:` filter: a workflow skipped by path filtering never reports a
# check, so it could not be required. See docs/ci.md.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # The notebook image does not fit on the runner's root disk as it comes: on
      # 2026-11-03 a PR run died unpacking its layers ("no space left on device")
      # while main passed the same minute. These are the runner's preinstalled
      # SDKs, none of which this job uses; the df lines put the margin in the log.
      - name: Free runner disk for the notebook image
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      # The JupyterHub notebook image, built by symmatree/tiles and public, so
      # no registry login. --user because its default is jovyan (uid 1000)
      # while the checkout belongs to the runner, and HOME with it since
      # /home/jovyan belongs to uid 1000.
      - name: Run in the notebook image
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${PWD}:/repo" \
            -w /repo \
            ghcr.io/symmatree/tiles/datascience-notebook-ssh:main \
            ./test.sh
