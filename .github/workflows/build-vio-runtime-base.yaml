name: build-vio-runtime-base
on:
  push:
    branches: [main]
    paths:
      - containers/vio-runtime-base/**
      - .github/workflows/build-vio-runtime-base.yaml
  pull_request:
    paths:
      - containers/vio-runtime-base/**
      - .github/workflows/build-vio-runtime-base.yaml
  workflow_dispatch: {}

jobs:
  build-vio-runtime-base:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/symmatree/coordinator-vio-runtime-base
    steps:
      - uses: actions/checkout@v4

      # amd64 leg builds under emulation. This base only `apt-get install`s (no heavy compile),
      # so QEMU is fine here, and it rebuilds rarely -- not worth the estimator's native matrix.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=ref,event=branch
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/vio-runtime-base
          file: containers/vio-runtime-base/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker-metadata.outputs.tags }}
          labels: ${{ steps.docker-metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
