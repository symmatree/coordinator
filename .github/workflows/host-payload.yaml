name: host-payload
# Pack the files a device installs into one tarball per commit, so a device can fetch
# an output instead of cloning the repo (#341). The work is in bin/build-payload, which
# also runs by hand; this is the trigger and the upload.
#
# No `paths:` filter: a workflow skipped by path filtering never reports a check, so it
# could not be required. See docs/ci.md.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: host-payload-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  payload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build the payload
        env:
          PAYLOAD_COMMIT: ${{ github.sha }}
          PAYLOAD_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          bin/build-payload payload
          tar -tvzf payload/rekon-host-*.tar.gz

      # Fails the build rather than uploading a payload missing a file a role installs
      # or carrying one it does not.
      - name: Check the payload against what the roles install
        run: bin/test_payload.py payload/rekon-host-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: rekon-host-${{ github.sha }}
          path: payload/rekon-host-*.tar.gz
          if-no-files-found: error
