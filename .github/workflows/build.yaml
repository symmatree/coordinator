name: "build"
# Deliberately no `paths:` filter. A workflow skipped by path filtering never
# reports a check at all, so a required context stays pending forever and the
# merge is blocked -- GitHub's own guidance is not to path-filter a required
# workflow. The filtering happens one level down instead, because a *job*
# skipped by a conditional reports success. See docs/ci.md.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: build-${{ github.ref }}
  # Supersede an outdated pull-request run, but never interrupt a push to main
  # part-way through pushing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Turns .github/components.json into two things: the filter spec handed to
  # paths-filter, and the matrix of components whose paths actually changed.
  # Both are derived from the same file, so a component cannot be declared in
  # one and forgotten in the other.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      containers: ${{ steps.matrix.outputs.containers }}
      firmware: ${{ steps.matrix.outputs.firmware }}
      # The raw name list, for jobs keyed to one component rather than to the
      # matrix. Derived from `changes` rather than from paths-filter's
      # per-filter outputs, whose names are not documented for hyphenated
      # filter keys.
      container_names: ${{ steps.containers.outputs.changes }}
    steps:
      - uses: actions/checkout@v6

      # paths-filter accepts its filters as an inline document, and JSON is
      # valid YAML, so the spec goes straight across without a template. Each
      # component watches its own paths plus its family's build machinery.
      - name: Build filter specs
        id: spec
        run: |
          set -euo pipefail
          for family in containers firmware; do
            spec=$(jq -c --arg f "${family}" \
              '.[$f] as $fam | $fam.components | map_values(.paths + $fam.machinery)' \
              .github/components.json)
            echo "${family}=${spec}" >> "${GITHUB_OUTPUT}"
          done

      - uses: dorny/paths-filter@v4
        id: containers
        with:
          filters: ${{ steps.spec.outputs.containers }}

      - uses: dorny/paths-filter@v4
        id: firmware
        with:
          filters: ${{ steps.spec.outputs.firmware }}

      # paths-filter reports which names matched; look each one up in
      # components.json to get the job it needs. `include` is not used to
      # select: an include entry that matches no existing combination creates a
      # new one, which would quietly build every component on every run.
      - name: Assemble matrices
        id: matrix
        env:
          CHANGED_CONTAINERS: ${{ steps.containers.outputs.changes }}
          CHANGED_FIRMWARE: ${{ steps.firmware.outputs.changes }}
        run: |
          set -euo pipefail
          assemble() {
            local family="$1" names="$2"
            jq -c --arg f "${family}" --argjson names "${names}" \
              '.[$f].components
               | to_entries
               | map(select(.key as $k | $names | index($k)))
               | map({component: .key} + (.value | del(.paths)))' \
              .github/components.json
          }
          containers=$(assemble containers "${CHANGED_CONTAINERS}")
          firmware=$(assemble firmware "${CHANGED_FIRMWARE}")
          echo "containers=${containers}" | tee -a "${GITHUB_OUTPUT}"
          echo "firmware=${firmware}" | tee -a "${GITHUB_OUTPUT}"

  # fleet-control is the only image with checks outside its Dockerfile, so it
  # gets its own job rather than a hook in the shared action. It no longer
  # gates the build the way it did as a `needs:` predecessor: the branch
  # ruleset requires a pull request and `build-ok`, so code that fails
  # typecheck cannot reach main to be pushed from in the first place.
  fleet-control-check:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.container_names), 'fleet-control')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: containers/fleet-control/package-lock.json
      - run: npm ci
        working-directory: containers/fleet-control
      - run: npm run typecheck
        working-directory: containers/fleet-control
      - run: npm test
        working-directory: containers/fleet-control

  containers:
    # Without an explicit name the check is labelled with every key of the
    # matrix entry, which is unreadable in the checks list.
    name: containers (${{ matrix.component }})
    needs: changes
    if: needs.changes.outputs.containers != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      # One component's failure must not hide another's.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.containers) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-container
        with:
          image: ${{ matrix.image }}
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          lockfile: ${{ matrix.lockfile }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  firmware:
    name: firmware (${{ matrix.component }})
    needs: changes
    if: needs.changes.outputs.firmware != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.firmware) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-firmware
        with:
          target: ${{ matrix.component }}
          context: ${{ matrix.context }}
          output_mount: ${{ matrix.output_mount }}
          artifact_glob: ${{ matrix.artifact_glob }}

  # The one required check. `if: always()` is load-bearing: under default
  # `needs` semantics this job is *skipped* when a build fails, and GitHub
  # counts a skipped check as a pass -- so the gate would go green exactly when
  # a build broke. It has to run regardless and read the results itself.
  build-ok:
    needs: [changes, fleet-control-check, containers, firmware]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "upstream results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *)
                echo "::error::a build job reported '${result}'"
                exit 1
                ;;
            esac
          done
          echo "every build job succeeded or was not needed"
