name: "build-container"
description: >-
  Build one coordinator container image, pushing to GHCR on everything except a
  pull request. Shared by every entry of build-containers.yaml's matrix.
inputs:
  image:
    description: "Full GHCR image name, without a tag"
    required: true
  context:
    description: "Docker build context"
    required: true
  dockerfile:
    description: "Path to the Dockerfile, relative to the repository root"
    required: true
  platforms:
    description: "Comma-separated buildx platform list"
    required: true
  github_token:
    description: "Token for the GHCR login"
    required: true
  lockfile:
    description: >-
      Path to an upstream.lock of shell assignments, each of which becomes a
      build-arg. Empty for a component with no pinned upstream inputs.
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Read upstream pins
      id: pins
      if: inputs.lockfile != ''
      shell: bash
      run: |
        set -euo pipefail
        LOCK="${{ inputs.lockfile }}"
        # Source rather than pass the file through: values are shell-quoted
        # (RPI_KEY_FPR is a quoted string with spaces) and docker build-args
        # want them unquoted. Re-emit by name so only what the lockfile
        # assigns is passed, not the whole environment.
        # shellcheck disable=SC1090
        source "${LOCK}"
        {
          echo "build_args<<PINS_END"
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "${LOCK}" | cut -d= -f1 | while read -r key; do
            printf '%s=%s\n' "${key}" "${!key}"
          done
          echo "PINS_END"
        } >> "${GITHUB_OUTPUT}"

    - uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: Docker metadata
      id: docker-metadata
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.image }}
        tags: |
          type=raw,value=main,enable={{is_default_branch}}
          type=sha
          type=ref,event=branch
          type=ref,event=tag

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.docker-metadata.outputs.tags }}
        labels: |
          ${{ steps.docker-metadata.outputs.labels }}
          fleet.source.ref=${{ github.ref }}
        build-args: |
          GIT_SHA=${{ github.sha }}
          GIT_REF=${{ github.ref }}
          ${{ steps.pins.outputs.build_args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
