<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>rekon10 fleet</title>
<style>
  :root { --bg:#12141a; --card:#1c1f28; --fg:#e8eaf0; --dim:#8b93a7; --line:#2b3040;
          --ok:#3ddc97; --warn:#ffb454; --bad:#ff6b6b; --busy:#5aa9ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif;
         padding:max(12px, env(safe-area-inset-top)) 12px 24px; }
  h1 { font-size:1.1rem; margin:8px 0 16px; color:var(--dim); font-weight:600;
       letter-spacing:.04em; text-transform:uppercase; }
  .node { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:14px; margin-bottom:12px; }
  .head { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .name { font-weight:700; font-size:1.05rem; }
  .meta { color:var(--dim); font-size:.82rem; margin-top:8px; word-break:break-word; }
  .warn { color:var(--warn); }
  /* wrap: a node card carries four buttons and four across is unreadable on a phone */
  .btns { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  button { flex:1 1 40%; min-height:56px; font-size:1rem; font-weight:650; border-radius:10px;
           border:1px solid var(--line); background:#242938; color:var(--fg); cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.primary { background:#25406b; border-color:#375d99; }
  pre { background:#0d0f14; border:1px solid var(--line); border-radius:8px; padding:10px;
        max-height:260px; overflow:auto; font-size:.76rem; margin:12px 0 0; white-space:pre-wrap; }
  .err { color:var(--bad); }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--line);
           border-radius:14px; padding:20px; max-width:min(92vw,420px); }
  dialog::backdrop { background:rgba(0,0,0,.65); }
  dialog h2 { margin:0 0 10px; font-size:1.05rem; }
  dialog .what { color:var(--dim); font-size:.86rem; margin-bottom:14px; }
  dialog .state { font-size:.82rem; margin-bottom:14px; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .topbar button { flex:0 0 auto; min-height:40px; padding:0 14px; font-size:.9rem; }
  .units { margin-top:12px; border-top:1px solid var(--line); }
  .unit { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
          padding:8px 0; border-bottom:1px solid var(--line); font-size:.86rem; }
  .unit .kind { color:var(--dim); font-size:.72rem; text-transform:uppercase;
                letter-spacing:.06em; flex:0 0 5.5rem; }
  .unit .id { font-weight:600; }
  .unit .sha { color:var(--dim); font-family:ui-monospace, monospace; font-size:.78rem; }
  .unit .title { flex-basis:100%; color:var(--dim); font-size:.8rem; }
  .unit .title.stale { color:var(--warn); }
  .badge { font-size:.7rem; padding:1px 7px; border-radius:99px; border:1px solid var(--line); }
  .badge.ok { color:var(--ok); border-color:#215f47; }
  .badge.stale { color:var(--warn); border-color:#6b4d1c; }
  .badge.unknown { color:var(--dim); }
  .pf { background:var(--card); border:1px solid var(--line); border-radius:12px;
        padding:14px; margin-bottom:12px; }
  .pf h2 { font-size:.95rem; margin:0 0 4px; }
  .pf .step { color:var(--dim); font-size:.82rem; margin:10px 0 6px; }
  .pf input[type=text] { width:100%; min-height:44px; padding:0 10px; font-size:1rem;
        border-radius:8px; border:1px solid var(--line); background:#0d0f14; color:var(--fg); }
  .sess { display:flex; gap:10px; align-items:flex-start; padding:8px 0;
        border-bottom:1px solid var(--line); font-size:.85rem; }
  .sess input[type=checkbox] { width:22px; height:22px; margin-top:2px; flex:0 0 auto; }
  .srcgroup { margin-top:12px; }
  .srcgroup .src { display:flex; gap:8px; align-items:baseline; padding:6px 0 2px;
                   border-bottom:1px solid var(--line); }
  .srcgroup .src .name { font-weight:700; font-size:.9rem; }
  .srcgroup .src .count { color:var(--dim); font-size:.76rem; }
  .srcgroup .src .count.err { color:var(--bad); }
  .sess .num { color:var(--dim); font-family:ui-monospace, monospace; font-size:.78rem; }
  .sess .why { flex-basis:100%; color:var(--dim); font-size:.76rem; margin-left:32px; }
  .sess.open { opacity:.55; }
</style>
<h1>rekon10 fleet</h1>
<div class="topbar">
  <button id="refresh">Refresh status</button>
  <span class="meta" id="stamp">status not loaded</span>
</div>
<div id="fleet">loading...</div>
<div class="pf">
  <h2>Post-flight</h2>
  <div class="meta">Stop capture, pick what to keep, the rest is deleted.</div>

  <div class="step">1 &mdash; stop capture, so sizes stop moving while you read them</div>
  <div class="btns"><button id="pfStop">Stop capture on all</button></div>

  <div class="step">2 &mdash; what is on the cards</div>
  <div class="btns"><button id="pfList">List sessions</button></div>
  <div id="pfSessions"></div>

  <div class="step">3 &mdash; name the flight, then retrieve what you ticked</div>
  <input type="text" id="pfFlight" placeholder="flight name, e.g. 2026-09-19-vio"
         autocapitalize="off" autocorrect="off" spellcheck="false" />
  <div class="btns">
    <button id="pfGet" class="primary">Retrieve ticked</button>
    <button id="pfPrune">Delete the rest</button>
  </div>
  <pre id="pfLog" hidden></pre>
</div>
<dialog id="confirm">
  <h2 id="cTitle"></h2>
  <div class="what" id="cWhat"></div>
  <div class="btns">
    <button id="cNo">Cancel</button>
    <button id="cYes" class="primary">Yes, do it</button>
  </div>
</dialog>
<script type="module">
  const $ = (h) => Object.assign(document.createElement('div'), h);
  const state = new Map();
  const dlg = document.getElementById('confirm');

  const WHAT = {
    converge:
      'Runs the Ansible playbook against the node: stops capture, converges packages and ' +
      'config, pulls images, reboots if anything changed, starts the stack. Same for a fresh ' +
      'card or a running one. Minutes on a Pi 4B, longer on a Zero.',
    'converge?reflashed=true':
      'As above, and clears the recorded SSH host key first -- for a card that has just been ' +
      'reflashed and therefore presents a new key.',
    stop:
      'Signals the container set and waits for it to exit. Nothing else -- packages, config ' +
      'and images are untouched, and a card that has never been converged can still be ' +
      'stopped. NOT a sticky off: the boot unit starts the stack again on the next power ' +
      'cycle, so nothing has to remember to undo this.',
    reboot:
      'One command, gated on nothing: the way out of a stuck box, so it does not depend on ' +
      'anything else working first. Nothing waits for it to come back -- refresh status when ' +
      'you want to know. Press Stop first if you want the containers to go down on our ' +
      'timeout rather than the shutdown\u2019s.',
    reimage:
      'Fetches the newest disk image for this role, stages it in the FAT partition, and ' +
      'arms the tryboot flasher. The device drops off the network and comes back on the new ' +
      'image, or does not -- refresh status to find out. Everything on the card is lost, the ' +
      'same as writing it from a card reader. Worst case is a card pull, which is what a ' +
      'reflash costs today.',
  };

  async function j(url, opts) {
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error ?? r.statusText);
    return r.json();
  }

  function render(nodes) {
    const root = document.getElementById('fleet');
    root.textContent = '';
    for (const n of nodes) {
      const st = state.get(n.name) ?? {};
      const card = $({ className: 'node' });

      const head = $({ className: 'head' });
      head.append(
        $({ className: 'name', textContent: n.name }),
        $({ className: 'meta', textContent: `${n.role}${n.host ? ' -- ' + n.host : ''}` }),
      );
      card.append(head);

      const btns = $({ className: 'btns' });
      const mk = (label, action, primary) => {
        const b = document.createElement('button');
        b.textContent = label;
        if (primary) b.className = 'primary';
        b.disabled = !!st.busy;
        b.onclick = () => confirmThen(n.name, action);
        return b;
      };
      btns.append(
        mk('Converge', 'converge', true),
        mk('Reflashed', 'converge?reflashed=true', false),
        mk('Stop', 'stop', false),
        mk('Reboot', 'reboot', false),
      );
      card.append(btns);

      if (st.probing) card.append($({ className: 'meta', textContent: 'asking...' }));
      else if (st.status) card.append(renderUnits(st.status, n.name));

      if (st.log?.length) {
        const pre = document.createElement('pre');
        pre.textContent = st.log.join('\n');
        card.append(pre);
      }
      root.append(card);
    }
  }

  /**
   * One row per versioned thing the machine reported.
   *
   * Display only. A stale row is labelled and shows both titles; nothing is greyed out and no
   * button is withheld, because whether a build exists yet is something the operator knows
   * and this page does not.
   */
  function renderUnits(status, nodeName) {
    const wrap = $({ className: 'units' });
    if (status.error) {
      wrap.append($({ className: 'unit err', textContent: status.error }));
      return wrap;
    }
    if (!status.units?.length) {
      wrap.append($({ className: 'unit meta', textContent: 'reported no units' }));
      return wrap;
    }
    for (const u of status.units) {
      const row = $({ className: 'unit' });
      const badge = u.lookupError
        ? { cls: 'unknown', text: 'unknown' }
        : u.current === true
          ? { cls: 'ok', text: 'current' }
          : u.current === false
            ? { cls: 'stale', text: 'behind' }
            : { cls: 'unknown', text: 'unversioned' };
      row.append(
        $({ className: 'kind', textContent: u.kind }),
        $({ className: 'id', textContent: u.id }),
        $({ className: 'sha', textContent: (u.revision ?? '').slice(0, 10) }),
        $({ className: 'sha', textContent: u.refName ? '@' + u.refName : '' }),
        Object.assign($({ className: 'badge ' + badge.cls }), { textContent: badge.text }),
      );
      if (u.title) row.append($({ className: 'title', textContent: u.title }));
      // What it would move to, so "the build I wanted is not here yet" is readable as a
      // title that has not appeared rather than a state this page tried to detect.
      if (u.headTitle) {
        row.append($({ className: 'title stale', textContent: '\u2192 ' + u.headTitle }));
      }
      if (u.lookupError) row.append($({ className: 'title err', textContent: u.lookupError }));
      // The disk image is the one unit whose update is not a converge. Offered whatever the
      // row says: whether a newer build exists is the operator's to judge, not this page's.
      if (u.kind === 'disk_image') {
        const b = document.createElement('button');
        b.textContent = 'Reimage';
        b.style.flex = '0 0 auto';
        b.style.minHeight = '34px';
        b.style.padding = '0 12px';
        b.style.fontSize = '.82rem';
        b.disabled = !!(state.get(nodeName) ?? {}).busy;
        b.onclick = () => confirmThen(nodeName, 'reimage');
        row.append(b);
      }
      wrap.append(row);
    }
    return wrap;
  }

  /**
   * Probe on demand, never on a timer and never on load. Nothing should touch the fleet
   * while it is flying, and a button is the whole scheduling policy.
   *
   * ONE REQUEST PER NODE, not one for the fleet. The fleet-wide route exists and is still
   * there for curl, but as a page it was the wrong shape: a sweep takes as long as the
   * slowest machine -- measured at 102s with one busy Zero -- and a single request means
   * nothing is shown until all of it lands, so the screen sits blank and then reports
   * "failed to fetch" if you navigate away from it. Per node, each row fills in as its
   * machine answers and a slow one costs only its own row.
   */
  async function refreshStatus() {
    const btn = document.getElementById('refresh');
    const stamp = document.getElementById('stamp');
    btn.disabled = true;

    const nodes = await j('/nodes');
    let done = 0;
    const tick = () => {
      stamp.textContent = done < nodes.length
        ? `probing... ${done}/${nodes.length}`
        : 'as of ' + new Date().toLocaleTimeString();
    };
    // Mark every node in flight up front, so a slow machine reads as "still asking" rather
    // than as a row that has not been touched.
    for (const n of nodes) {
      const st = state.get(n.name) ?? {};
      st.probing = true;
      state.set(n.name, st);
    }
    tick();
    render(nodes);

    await Promise.all(nodes.map(async (n) => {
      const st = state.get(n.name) ?? {};
      try {
        st.status = await j(`/nodes/${n.name}/status`);
      } catch (e) {
        // A request that fails is this node's answer, not the screen's. The commonest cause
        // is navigating away mid-probe, which the browser reports as "failed to fetch".
        st.status = { node: n.name, error: `could not ask: ${e.message}` };
      }
      st.probing = false;
      state.set(n.name, st);
      done += 1;
      tick();
      render(nodes);
    }));

    btn.disabled = false;
  }
  document.getElementById('refresh').onclick = refreshStatus;

  /** Every action confirms first, so a bump on a phone screen cannot start anything. */
  async function confirmThen(name, action) {
    document.getElementById('cTitle').textContent = `${action} ${name}?`;
    document.getElementById('cWhat').textContent = WHAT[action];
    dlg.showModal();
    document.getElementById('cYes').onclick = () => { dlg.close(); run(name, action); };
    document.getElementById('cNo').onclick = () => dlg.close();
  }

  async function run(name, action) {
    const st = state.get(name) ?? {};
    st.busy = true; st.log = [`starting ${action}...`];
    state.set(name, st);
    render(await j('/nodes'));
    let id;
    try { ({ id } = await j(`/nodes/${name}/${action}`, { method: 'POST' })); }
    catch (e) {
      st.busy = false; st.log.push(`error: ${e.message}`); state.set(name, st);
      return render(await j('/nodes'));
    }

    const status = await watchRun(id, async (line, reset) => {
      if (reset) st.log = [];
      st.log.push(line);
      if (st.log.length > 400) st.log.splice(0, st.log.length - 400);
      render(await j('/nodes'));
    });
    st.busy = false;
    st.log.push(lostNote(status) ?? `[fleet-control] run ${status}`);
    state.set(name, st);
    render(await j('/nodes'));
  }

  /** How long to wait before reattaching, so a stream that refuses to stay up cannot spin. */
  const REATTACH_MS = 1000;

  /**
   * Watch a run to its end and say how it ended: `succeeded`, `failed`, or `lost`.
   *
   * A DROPPED STREAM IS NOT AN ENDING. Both callers used to treat it as one -- the node card
   * stopped repainting and sat mid-run forever, and the retrieve loop below went further and
   * unticked the session as though it had been collected. An EventSource dies for reasons that
   * have nothing to do with the run; a phone locking its screen is enough.
   *
   * So on error this asks `/runs/:id`, which separates all three cases because the registry is
   * in memory and the playbook is a child of the process driving it:
   *
   * - still running -> reattach. The stream dying is not the run dying.
   * - finished      -> report the ending we missed, from the service's own lines.
   * - 404           -> `lost`: the service restarted and took the run with it. It is not
   *                    running somewhere else and nothing resumes.
   *
   * `onLine(line, reset)` -- `reset` asks the caller to discard what it has first, because
   * `/stream` replays every line it holds on connect, so anything kept across a reattach is a
   * duplicate. The service's record is the authoritative one.
   */
  function watchRun(id, onLine) {
    return new Promise((resolve) => {
      const attach = () => {
        const es = new EventSource(`/runs/${id}/stream`);
        es.onmessage = (ev) => onLine(JSON.parse(ev.data).line, false);
        es.addEventListener('done', (ev) => {
          es.close();
          resolve(JSON.parse(ev.data).status);
        });
        es.onerror = async () => {
          es.close();
          let run;
          try { run = await j(`/runs/${id}`); } catch { return resolve('lost'); }
          if (run.status !== 'running') {
            run.lines.forEach((l, i) => onLine(l.line, i === 0));
            return resolve(run.status);
          }
          onLine('[fleet-control] connection dropped; still running, reattaching (log resynced)', true);
          setTimeout(attach, REATTACH_MS);
        };
      };
      attach();
    });
  }

  /** The one status that needs explaining rather than reporting. */
  const lostNote = (status) => status !== 'lost' ? undefined
    : '[fleet-control] the service restarted; this run is lost and the node may be '
      + 'part-converged. Refresh status, then run it again.';

  // ---- post-flight --------------------------------------------------------------------
  // Sessions are loaded on demand, like status: nothing touches the fleet unprompted. The
  // open session is shown but cannot be ticked -- only a reboot closes one, so it is not
  // packageable and saying so beats omitting it and leaving the list looking short.

  // `asked` is the render order, the grouping, AND the only copy of what is on the cards: one
  // block per node we put the question to, including the ones that answered with nothing.
  // Keeping a second flat array beside it meant a prune could filter one and not the other and
  // leave deleted sessions on screen.
  const pf = { picked: new Set(), asked: [] };

  /** What a tick is. Keyed on the node we ASKED, not the name the device reports itself as. */
  const key = (srcName, s) => `${srcName}/${s.session}`;
  /** Every session on screen, with the device it came from. */
  const allSessions = () => pf.asked.flatMap((src) => src.sessions.map((s) => ({ src, s })));
  const pfLog = document.getElementById('pfLog');

  function log(line) {
    pfLog.hidden = false;
    pfLog.textContent += (pfLog.textContent ? '\n' : '') + line;
    pfLog.scrollTop = pfLog.scrollHeight;
  }

  const MB = (n) => `${(n / 1e6).toFixed(0)} MB`;
  const clock = (iso) => `${iso.slice(11, 19)}Z`;

  /**
   * What the sidecar times say -- which for the session you most want is not a duration.
   *
   * `last_utc` is null when the final sidecar cannot be read, and a session that ended in a
   * POWER CUT ends exactly that way: the last `.json` is written and never flushed, leaving
   * it zero-length while its `.jpg` is intact. Observed on the first real retrieval
   * (260923-test-mission): frame 299 of 300, `…121148_631601Z.json`, 0 bytes.
   *
   * This used to return 'no frames' for that, so a 300-frame flight was labelled empty --
   * the one row in the list that must not be mistaken for junk. A missing end is now said as
   * a missing end, and 'no frames' is reserved for a session that really has none.
   */
  const span = (s) => {
    if (s.first_utc && s.last_utc) {
      const secs = Math.round((Date.parse(s.last_utc) - Date.parse(s.first_utc)) / 1000);
      return secs >= 60 ? `${Math.floor(secs / 60)}m${secs % 60}s` : `${secs}s`;
    }
    if (s.first_utc) return `from ${clock(s.first_utc)}`;
    return s.frames > 0 ? 'no times' : 'no frames';
  };

  /**
   * One block per device, because a semantic session is one session from EACH device and the
   * choice is made per device. Flat, the campods' sessions interleave and picking one from
   * each means reading the node column on every row.
   *
   * There is nothing to align them by yet: a session directory is a boot id with no clock in
   * it, and the sidecar times come from a device with no RTC that jumps when NTP lands. So the
   * grouping is the whole affordance -- pick the long one in each block.
   *
   * A device that answered with NOTHING still gets its block. The coordinator does exactly
   * that (coordinator#371: it has no campod-shaped sessions), and "coordinator -- no sessions"
   * is a different statement from a list that quietly omits it.
   */
  function renderSessions() {
    const root = document.getElementById('pfSessions');
    root.textContent = '';
    if (pf.asked.length === 0) {
      root.append($({ className: 'meta', textContent: 'nothing listed yet' }));
      return;
    }
    for (const src of pf.asked) {
      const group = $({ className: 'srcgroup' });
      const head = $({ className: 'src' });
      head.append($({ className: 'name', textContent: src.name }));
      head.append(
        src.error
          ? $({ className: 'count err', textContent: src.error })
          : $({
              className: 'count',
              textContent: src.sessions.length === 1 ? '1 session' : `${src.sessions.length} sessions`,
            }),
      );
      group.append(head);
      for (const session of src.sessions) group.append(sessionRow(src, session));
      root.append(group);
    }
  }

  /** One session. The node is on the group heading, so the row does not repeat it. */
  function sessionRow(src, s) {
    const row = $({ className: 'sess' + (s.open ? ' open' : '') });
    const box = document.createElement('input');
    box.type = 'checkbox';
    box.disabled = !!s.open;
    const k = key(src.name, s);
    box.checked = pf.picked.has(k);
    box.onchange = () => { box.checked ? pf.picked.add(k) : pf.picked.delete(k); };
    row.append(
      box,
      // Frames and span are what tell a flight from a failed-lock power cycle; the
      // directory name is a boot id and carries no clock at all.
      $({ className: 'num', textContent: `${s.frames} frames` }),
      $({ className: 'num', textContent: span(s) }),
      $({ className: 'num', textContent: MB(s.bytes) }),
    );
    if (s.open) row.append($({ className: 'why', textContent: 'current boot -- only a reboot closes a session, so this one cannot be packaged' }));
    else row.append($({ className: 'why', textContent: s.session }));
    return row;
  }

  document.getElementById('pfStop').onclick = async () => {
    const nodes = await j('/nodes');
    for (const n of nodes) {
      try { await j(`/nodes/${n.name}/stop-capture`, { method: 'POST' }); log(`${n.name}: capture stopped`); }
      catch (e) { log(`${n.name}: ${e.message}`); }
    }
  };

  document.getElementById('pfList').onclick = async () => {
    pf.picked.clear();
    pf.asked = [];
    for (const n of await j('/nodes')) {
      // Recorded before the request, so a node that is still being asked is visible as an
      // empty block rather than as an absence.
      const src = { name: n.name, sessions: [] };
      pf.asked.push(src);
      renderSessions();
      try {
        src.sessions = (await j(`/nodes/${n.name}/sessions`)).sessions;
      } catch (e) {
        src.error = e.message;
        log(`${n.name}: ${e.message}`);
      }
      renderSessions();
    }
  };

  /** One session per call, so a failure costs that session rather than the whole selection. */
  document.getElementById('pfGet').onclick = async () => {
    const flight = document.getElementById('pfFlight').value.trim();
    if (!flight) return log('name the flight first');
    if (pf.picked.size === 0) return log('nothing ticked');
    for (const key of [...pf.picked]) {
      const [node, session] = [key.slice(0, key.indexOf('/')), key.slice(key.indexOf('/') + 1)];
      log(`${node}: starting ${session.slice(0, 8)}`);
      try {
        const { id } = await j(`/nodes/${node}/offload?session=${session}&flight=${encodeURIComponent(flight)}`, { method: 'POST' });
        const status = await watchRun(id, (line) => log('  ' + line));
        // UNTICK ONLY ON SUCCESS. This used to untick whenever the stream ended for any
        // reason, including a dropped connection -- so a session could be marked collected
        // while its transfer was still running, or after the service restarted mid-transfer.
        // A ticked session that was actually retrieved costs one retry; an unticked session
        // that was not is a session "Delete the rest" then deletes.
        if (status === 'succeeded') {
          pf.picked.delete(key);
        } else {
          log(`  ${node}: ${lostNote(status) ?? `run ${status}`} -- leaving ${session.slice(0, 8)} ticked`);
        }
      } catch (e) { log(`${node}: ${e.message}`); }
    }
    renderSessions();
  };

  /** Everything not ticked, per node. Confirms, because it is the irreversible one. */
  document.getElementById('pfPrune').onclick = async () => {
    const doomed = allSessions().filter(({ src, s }) => !pf.picked.has(key(src.name, s)));
    if (doomed.length === 0) return log('nothing to delete');
    document.getElementById('cTitle').textContent = `Delete ${doomed.length} session(s)?`;
    document.getElementById('cWhat').textContent =
      `Removes them and their bundles from the devices, freeing about ` +
      `${MB(doomed.reduce((a, { s }) => a + s.bytes, 0))}. Anything you ticked is left alone. ` +
      `This cannot be undone, and anything not already retrieved is gone.`;
    dlg.showModal();
    document.getElementById('cNo').onclick = () => dlg.close();
    document.getElementById('cYes').onclick = async () => {
      dlg.close();
      const byNode = {};
      for (const { src, s } of doomed) (byNode[src.name] ??= []).push(s.session);
      for (const [node, sessions] of Object.entries(byNode)) {
        try {
          const r = await j(`/nodes/${node}/sessions/delete`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ sessions }),
          });
          log(`${node}: freed ${MB(r.bytes)}`);
        } catch (e) { log(`${node}: ${e.message}`); }
      }
      // Drop what was deleted from the one list there is, so the screen is what is left.
      for (const src of pf.asked) src.sessions = src.sessions.filter((s) => pf.picked.has(key(src.name, s)));
      renderSessions();
    };
  };

  renderSessions();
  render(await j('/nodes'));
</script>
