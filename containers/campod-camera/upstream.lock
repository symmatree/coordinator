# Pinned build inputs for coordinator-campod-camera image builds.
# picamera2 + libcamera come from the Raspberry Pi apt archive at build time
# (no git SHA to pin); keep RPI_SUITE aligned with the host Pi OS release.

BASE_IMAGE=debian:trixie-slim
RPI_SUITE=trixie
# The archive key comes from this keyring package rather than the raw .gpg.key
# URL: same key and fingerprint, but re-signed with SHA-512. Load-bearing -- the
# raw URL's 2012 SHA-1 self-signatures are rejected outright by trixie's Sequoia
# verifier, so the raw fetch leaves the repo treated as unsigned.
RPI_KEYRING_DEB=pool/main/r/raspberrypi-archive-keyring/raspberrypi-archive-keyring_2025.1+rpt1_all.deb
RPI_KEY_FPR="CF8A 1AF5 02A2 AA2D 763B AE7E 82B1 2992 7FA3 303E"
