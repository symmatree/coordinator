# Broker for the pod link. Lives on the coordinator because that is the only box
# every campod can reach, over the USB gadget net.
#
# BINDS 0.0.0.0, not the gadget address. Binding 10.55.0.1 would be tighter, but
# it races br0 coming up at boot, and the stack sets no restart policy (#308) --
# so a bind failure at power-up is a broker that stays down for the flight with
# nothing to bring it back. The exposure it buys back is bounded by the radio
# being off in flight, which is the actual control.
listener 1883
allow_anonymous true

# PERSISTENCE OFF, deliberately. Retained messages would otherwise be written to
# the card, and this is a box whose power is pulled without warning and whose disk
# filling is a documented failure. Nothing is lost by it: the publisher forces a
# republish on every connect, so the retained intent is re-established within one
# poll of the broker coming back rather than being recovered from disk.
persistence false

# Everything the broker says goes to the journal with the rest of the stack, so
# "did the pods ever connect" is answerable from the same place as everything else
# after a flight.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
