# Coordinator stack (Pi 4B). Installed on the Pi at /opt/stacks/coordinator/.
#
# Values live HERE, not in a .env beside it. One file per stack: what you read is
# what runs, with no second config surface to keep in sync and no interpolation to
# resolve in your head. This is not a template to copy and fill in -- the box gets
# it through the /opt/stacks symlink, so `git pull` is the deploy (#48) and a value
# you want different is a commit, not a local edit.
#
# Manage with the shared CLI: coord pull | start | stop | status | logs [service]
#
# WHAT STARTS: everything in this file. `coord start` runs the whole stack -- no
# profile, no env var, no file, nothing to select. The default is a property of
# this file's structure rather than a value that can go missing, which is the
# failure that silently stopped campod from starting (#240).
#
# Bench subsets are named on the command line when someone actually wants one:
#   coord start vio-tracker                  # tracker alone   (docs/bench-tracker.md)
#   coord start vio-tracker vio-estimator    # vision chain    (docs/bench-estimator.md)
#   coord start vio-estimator                # estimator alone (harness/README.md)
#
# There are deliberately NO compose profiles here. tracker/bench/flight were
# bring-up scaffolding: they named stages of this stack's own incremental
# construction, and only ever worked because COMPOSE_PROFILES=flight was pinned
# in a .env. They put a mode choice between the operator and the thing running,
# for a set of modes nobody needed. The operator is flying, not picking profiles.
#
# No tracker->estimator depends_on: ordering is not required -- the tracker
# tolerates an absent listener (drops packets) and the estimator picks up the
# continuous stream whenever it binds.

services:
  vio-tracker:
    image: ghcr.io/symmatree/coordinator-vio-tracker:main
    container_name: coordinator_vio_tracker
    privileged: true
    volumes:
      # Bind-mount /dev/bus/usb (NOT `devices:`). When depthai uploads firmware
      # the MyriadX resets and re-enumerates to a new USB address/node. A static
      # `devices:` mapping snapshots nodes at container start, so the booted
      # device is invisible -> X_LINK_DEVICE_NOT_FOUND. A bind mount of the
      # directory propagates the new node live. (privileged: true opens the
      # device cgroup so the new node is usable.)
      - /dev/bus/usb:/dev/bus/usb
      - /var/lib/coordinator/ipc:/tmp
      - /var/lib/coordinator/config:/config:ro
      # #72: periodic disparity + RGB stills land here when OAK_CAPTURE_DIR is set.
      - /var/lib/coordinator/captures:/captures
      # The node's own name, for the first level of captures/. A container's hostname is
      # its container id -- meaningless, and different after every recreate -- so the
      # host's name has to be mounted in. Byte-identical to the two lines campod's stack
      # carries for the same reason (#272, #386).
      - /etc/hostname:/etc/host-hostname:ro
    environment:
      # Enables in-tracker capture (disparity + stills) alongside VIO. This is the
      # CONTAINER path. Unset it and the tracker is byte-for-byte upstream: no
      # color camera, no disk writes.
      OAK_CAPTURE_DIR: /captures
      # #88: image capture (disparity/mono/stills) is gated on FC ARM.
      # coordinator-mavlink writes the arm state to this shared file -- both
      # containers mount the IPC dir at /tmp -- and vio-tracker reads it, so bench
      # and idle time do not fill the card with pictures of the desk. The .feat
      # (IMU+features) is NOT gated: the FC's EKF starts before arm, so replay
      # needs the pre-arm stream. Disarm also triggers a filesystem sync()
      # (durability through the power cut).
      OAK_ARM_FILE: /tmp/fc_armed
      OAK_JPEG_QUALITY: "92"
      # Disparity is OFF: it is a VIO-debugging aid, not a mission product, and
      # image writing is implicated in the tracker dropping ~half its frames
      # (E31, #156) -- measured within a single session, pre-arm (writers gated
      # off) 0.0% loss over 539 consecutive frames against 53.5% once the arm gate
      # opened. Set to 1.0 to get it back for a debugging flight.
      OAK_DISPARITY_HZ: "0"
      OAK_STILL_HZ: "0.2"
      OAK_STILL_RESOLUTION: 12mp
      # In flight the ~30 ms auto-exposure (@ ISO 110) smeared every frame. Cap the
      # shutter so auto-exposure trades to ISO/gain instead (accept some noise or
      # underexposure for a sharp frame); 0 = no cap.
      OAK_STILL_MAX_EXPOSURE_US: "5000"
      # IMX378 lens/VCM position with AF off: 255 = macro at 8 cm, ~120-130 =
      # infinite focus (varies module to module), below that the lens sits too
      # close to the sensor array and goes out of focus (depthai
      # CameraControl.hpp). Mapping subjects are past hyperfocal, so infinity.
      # "auto" = leave AF on.
      OAK_STILL_FOCUS: "125"
      # Also capture the rectified-LEFT mono frame -- the exact image the feature
      # tracker consumes -- so a feature-starvation (E19) can be explained by what
      # the camera saw (#125). Host samples at this rate; 0 disables. OFF for the
      # same reason as disparity above: a VIO-debugging aid, and the 1 Hz PNG
      # writers are where the dose-response in E31 points (loss vs images/second,
      # r=0.85). It did its job once already -- 260814 is the only flight with the
      # mono VIO input on disk (E33). Set to 1.0 for a debugging flight.
      OAK_MONO_HZ: "0"
      # Cap the MONO auto-exposure shutter (us) so AE trades to gain instead of a
      # long, blurring exposure in low light. Unlike OAK_STILL_MAX_EXPOSURE_US
      # (color/mapping cam), this changes the VIO input itself. 0 = no cap
      # (current behaviour). Bench-verify feature tracking before trusting a value
      # in flight.
      OAK_MONO_MAX_EXPOSURE_US: "0"

  vio-estimator:
    image: ghcr.io/symmatree/coordinator-vio-estimator:main
    container_name: coordinator_vio_estimator
    volumes:
      - /var/lib/coordinator/ipc:/tmp
      - /var/lib/coordinator/config:/config:ro
    # No environment: the entrypoint reads only VINS_CONFIG, which defaults to
    # /config/oak_d.yaml (mounted above). The old env_file handed this service
    # every OAK_*/MAVLINK_* value in the stack; none was ever read.

  coordinator-mavlink:
    image: ghcr.io/symmatree/coordinator-mavlink:main
    container_name: coordinator_mavlink
    privileged: true
    network_mode: host
    depends_on:
      - vio-estimator
    devices:
      # The REAL node /dev/ttyAMA0, NOT the /dev/serial0 symlink: Docker's
      # `devices:` mapping does not follow symlinks, so /dev/serial0 never appears
      # inside the container and the router crash-loops on ENOENT. With disable-bt
      # (supplied by the image, pi-image/roles/coordinator/config.append.txt),
      # ttyAMA0 is the PL011 primary UART (= what /dev/serial0 points to).
      # Verified on the bench 2026-07-09.
      - /dev/ttyAMA0:/dev/ttyAMA0
    volumes:
      - /var/lib/coordinator/ipc:/tmp
      # #167/#220: timesync.jsonl and vehicle.tlog land in THIS BOOT's session
      # directory under here, so collecting the session collects them. The router
      # derives <captures>/<node>/<boot-id>/ itself -- see COORD_CAPTURES_DIR below.
      - /var/lib/coordinator/captures:/captures
      # The node's own name, for that path. A container's hostname is its container
      # id, so the host's has to be mounted in; identical to the line vio-tracker
      # and campod-camera carry (#272).
      - /etc/hostname:/etc/host-hostname:ro
    environment:
      MAVLINK_DEVICE: /dev/ttyAMA0
      MAVLINK_BAUD: "1500000"
      # #88: the router is the writer of the arm-state file vio-tracker reads.
      OAK_ARM_FILE: /tmp/fc_armed
      # The captures ROOT, not a file path: the router appends <node>/<boot-id>/ and
      # writes timesync.jsonl and vehicle.tlog in there. It cannot be handed a full
      # path because the boot id is not known until boot. Empty disables both.
      #
      # These used to be written at the captures root, which put them outside every
      # session and outside what `coord sessions package` collects -- so a flight's
      # capture could be retrieved without the FC telemetry recorded alongside it.
      # docs/flight-data-layout.md always placed them inside the session (#386).
      #
      # Volume: MAV2 runs EXT_STAT/POSITION/EXTRA1-3 at 2 Hz with no param change,
      # ~41 msg/s -> ~0.7 MB for a six-minute flight.
      COORD_CAPTURES_DIR: /captures

  # #115: coordinator front-panel status OLED. Drives the SH1106 on the Pi's I2C
  # (0x3C, /dev/i2c-1) -- a separate bus from the FC's compass. Reads the captures
  # dir (read-only) to show capture activity. Runs whenever the coordinator is up.
  # The broker the pods reach the coordinator through. SAME IMPLEMENTATION AS THE
  # CLUSTER (tales/tanka/environments/mochi-mqtt, mochimqtt/server:2.7), so the
  # eventual federation of this on-device bus up to the central node is two
  # instances of one thing rather than a translation. That federation is the
  # stated intent in tiles/docs/overview.md and is why the broker choice was not
  # free.
  #
  # Config differences from the cluster environment are in mochi-config.yaml, each
  # with its reason; the short version is no persistence hook, because retained
  # state here would be card writes on a box that loses power without warning.
  mochi-mqtt:
    image: mochimqtt/server:2.7
    container_name: coordinator_mochi_mqtt
    network_mode: host
    volumes:
      - ./mochi-config.yaml:/config.yaml:ro

  # Publishes capture intent to the pods. It reads the arm file the router already
  # writes (#88) rather than speaking MAVLink itself, so there is one place that
  # decides what "armed" means and this is downstream of it.
  pod-link:
    image: ghcr.io/symmatree/coordinator-pod-link:main
    container_name: coordinator_pod_link
    network_mode: host
    depends_on:
      - mochi-mqtt
    # Same as the campod's, and for the same two reasons: the container inits have to
    # be visible for stack control, and the Docker socket below is how ONE service is
    # stopped. That is the granularity this box needs -- `coord fc-log` requires
    # coordinator-mavlink to let go of /dev/ttyAMA0, and stopping the whole stack here
    # would take the broker down with the instruction that asked for it.
    pid: host
    volumes:
      # The arm file lives in the shared ipc dir the router mounts as /tmp.
      - /var/lib/coordinator/ipc:/ipc:ro
      - /etc/hostname:/etc/host-hostname:ro
      - /etc/fleet-image:/etc/fleet-image:ro
      # Per-service start and stop, by the container_name pinned in this file.
      # Four HTTP calls over the socket, not the docker CLI -- the CLI is the thing
      # that costs page faults, and this box can afford the daemon either way.
      - /var/run/docker.sock:/var/run/docker.sock
      # For an ordered reboot after a converge, and to report the radio state. The
      # coordinator's radio cannot go closed yet (no wired uplink fitted), so this is
      # the reboot half in practice.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # Free space where captures land, read-only, for the status document.
      - /var/lib/coordinator/captures:/captures:ro
    environment:
      POD_LINK_ROLE: publisher
      POD_LINK_BROKER: tcp://127.0.0.1:1883
      POD_LINK_ARM_FILE: /ipc/fc_armed
      POD_LINK_PERIOD_S: "2"
      POD_LINK_DATA_DIR: /captures
      # This box has no capture processes of its own writing status documents; the
      # tracker and the router write into the session instead. Empty, so the status
      # document carries no camera or accel section rather than an error about two
      # files that were never meant to exist here.
      POD_LINK_CAMERA_STATUS_FILE: ""
      POD_LINK_ACCEL_STATUS_FILE: ""

  sh1106-display:
    image: ghcr.io/symmatree/coordinator-sh1106-display:main
    container_name: coordinator_sh1106_display
    devices:
      - /dev/i2c-1:/dev/i2c-1
    volumes:
      - /var/lib/coordinator/captures:/captures:ro
    # No environment: display.py reads SH1106_NODE / SH1106_I2C_PORT /
    # SH1106_I2C_ADDR / SH1106_CAPTURES_DIR / SH1106_REFRESH_SEC, and every
    # default is already what we want (hostname, bus 1, 0x3C, /captures, 1.0 s).
