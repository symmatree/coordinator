# Campod stack (Pi Zero 2 W). Installed on the Zero at /opt/stacks/campod/.
#
# Values live HERE, not in a .env beside it. One file per stack: what you read is
# what runs, with no second config surface to keep in sync and no interpolation
# to resolve in your head.
# Manage with the shared CLI: coord pull | start | stop | status | logs [service]
#
# Two services off one image, one process each; they agree on an output path via
# the kernel boot_id. See containers/campod-camera/README.md.
#
# No profiles. campod-camera is what a campod is for, so `coord start` starts it --
# there is no useful run of this stack with capture switched off, and the switch
# cost a silent one: #233 folded the .env in here but COMPOSE_PROFILES=capture was
# the one key compose reads itself rather than passing to a service, so it had
# nowhere to land. Every service carried a profile, nothing set one, and
# `coord start` brought up nothing and said so only by printing no services.
# A profile would earn its place only for a service that must NOT run alongside
# the others; there is no such service on either stack now (#242 removed the one
# that was, oak-still-capture). Phase 4's control API and alloy run *with*
# capture, so they will not need one either.

services:
  campod-camera:
    image: ghcr.io/symmatree/coordinator-campod-camera:main
    container_name: campod_camera
    # libcamera/IMX708 passthrough. privileged populates the container /dev with
    # host devices and lifts the device cgroup (same pattern as vio-tracker);
    # /run/udev lets libcamera enumerate the camera. If enumeration ever fails,
    # fall back to explicit devices (/dev/video*, /dev/media*, /dev/dma_heap,
    # vchiq). Verified end-to-end on hardware in #23.
    #
    # privileged also covers /dev/spidev* for the ADXL345 reader (#211), which is
    # why no explicit device list is needed for it either. The host still needs
    # dtparam=spi=on for those nodes to exist at all.
    # SIGTERM -> SIGKILL grace. Docker's default is 10s and nothing here set it,
    # which is below the only complete graceful exit we have measured: under
    # systemd's shutdown both containers took 35.0s and exited 0. Under a 10s
    # grace the camera is SIGKILLed (137) instead, so we were cutting the shutdown
    # off at under a third of what it needed and never seeing it finish.
    #
    # 90s because that is the ceiling the successful exit actually ran under
    # (systemd's DefaultTimeoutStopSec), rather than a number picked for feel.
    # Compose has been measured taking ~20s to deliver the signal at all on a
    # loaded pod, so 20 + 90 = 110s worst case, inside the 180s async ceiling on
    # the stop task in site.yaml with room to spare.
    #
    # This does not claim to fix the stop hanging (#355). It removes one ceiling
    # known to be set below a measured completion time.
    stop_grace_period: 90s
    privileged: true
    volumes:
      # /var/lib/campod is where the image mounts the @data btrfs subvolume; see
      # docs/campod.md for why that path is load-bearing across two repos.
      - /var/lib/campod/captures:/captures
      - /var/lib/campod/config:/config:ro
      - /run/udev:/run/udev:ro
      # The node's own name. A container's hostname is its container ID, which is
      # meaningless and different after every recreate, so the readers cannot
      # simply ask. Mounting the host's makes the host the single source of truth,
      # and this line is byte-identical on all four pods -- which is the point.
      # It replaces a literal CAMPOD_NODE_NAME in this file: one per-unit value in
      # a file describing four machines, so every pod claimed to be campod-sw and
      # the data misidentified its own origin (#272).
      - /etc/hostname:/etc/host-hostname:ro
      # The card-image manifest, for the same reason and by the same route.
      # Both writers list it as a manifest source and copy it into each
      # session, but it lives on the host and was never mounted, so every
      # session so far logged `this session is unattributed` and recorded only
      # the payload half of the chain. If it is ever absent docker leaves an
      # empty directory here, which reads as the same unattributed log line.
      - /etc/fleet-image:/etc/fleet-image:ro
    environment:
      CAMPOD_CAPTURE_HZ: "1.0"
      # 0 = sensor full resolution (IMX708 4608x2592)
      CAMPOD_CAPTURE_WIDTH: "0"
      CAMPOD_CAPTURE_HEIGHT: "0"
      CAMPOD_JPEG_QUALITY: "90"
      # Cap the shutter so auto-exposure trades to gain instead of a blurring long
      # exposure; 0 = uncapped. Matches OAK_STILL_MAX_EXPOSURE_US on the
      # coordinator so the two cameras stay comparable. Blur budget at 5 ms:
      # hover at 2.5 m is negligible, survey at 25 m and 5 m/s is ~3.5 px of
      # along-track smear -- drop toward 1500 if survey frames come back soft.
      CAMPOD_STILL_MAX_EXPOSURE_US: "5000"
      # Lens position in DIOPTRES (1/metres): 0.0 infinity, 0.5 = 2 m, 2.0 = 0.5 m.
      # NOT the OAK-D's 0-255 scale.
      #
      # This was 0.8 (= 1.25 m) on the argument that 1.25 m is hyperfocal so
      # 0.62 m to infinity lands inside a 2 px circle of confusion, 2 px being
      # free because the Airy disk at f/2.2 is already 2.1 px. The second half of
      # that is wrong: 2.44*lambda*N = 2.95 um = 2.1 px is the FIRST-NULL DIAMETER
      # of the Airy pattern, not its blur width. The FWHM is 1.029*lambda*N =
      # 1.24 um = 0.89 px, so at f/2.2 with 1.4 um pixels this lens is roughly
      # pixel-matched rather than diffraction-limited -- and defocus does not hide
      # underneath diffraction, the two compound.
      #
      # At a 1 px circle of confusion, which is what feature matching needs,
      # hyperfocal is 2.46 m and focusing at 1.25 m gives 0.83 m to 2.55 m.
      # Measured against the 260926 outdoor stills, which the model reproduces:
      # table at ~0.06 m 36 px blur (visibly fuzzy), grass at ~0.9 m 0.7 px
      # (sharp), tree at ~5 m 1.5 px, house at ~20 m 1.8 px, infinity 2.0 px.
      #
      # A mapping pass photographs the ground from flight altitude, so the subject
      # is effectively at infinity and 2 px of defocus is a floor no exposure cap
      # or mount change can lift. At infinity the defocus at 25 m is 0.10 px. The
      # cost is the near field, which the mission does not use.
      CAMPOD_STILL_FOCUS: "infinity"
      # off | server | client -- multi-campod sync is #24.
      CAMPOD_SYNC_MODE: "off"
      # Capture is PAUSED until something says otherwise (#434). The camera still
      # comes up, warms through CAMPOD_WARMUP_FRAMES frames to pay the import and
      # prove it can write, and then holds ready -- started, buffers allocated,
      # retrieving nothing.
      #
      # This exists because a bench pod wrote 29 GB and filled its card, which does
      # not present as a full disk: it presents as a pod that cannot capture, stops
      # answering, and invites three wrong explanations. Collection is wanted for
      # the minutes of a flight, not the hours beside one.
      #
      # UNTIL SOMETHING WRITES THIS FILE, A CAMPOD DOES NOT CAPTURE IN FLIGHT. The
      # writer is the pod control path (#25); today it is a person. Set the value
      # empty to disable gating entirely and capture continuously, which is the
      # behaviour before this change.
      CAMPOD_CAPTURE_FLAG: "/tmp/campod_capture"
      CAMPOD_WARMUP_FRAMES: "10"
    # Explicit even though it matches the image's CMD, because the accel service
    # below overrides it -- reading one without the other would be misleading.
    command: ["python3", "/opt/campod/capture.py"]

  campod-accel:
    image: ghcr.io/symmatree/coordinator-campod-camera:main
    container_name: campod_accel
    # privileged for /dev/spidev0.0 and 0.1. The host still needs dtparam=spi=on
    # for those nodes to exist at all. No /run/udev and no /config: SPI has no
    # enumeration, so there is nothing to discover and nothing to configure --
    # a DEVID read is the only presence test there is.
    # SIGTERM -> SIGKILL grace. Docker's default is 10s and nothing here set it,
    # which is below the only complete graceful exit we have measured: under
    # systemd's shutdown both containers took 35.0s and exited 0. Under a 10s
    # grace the camera is SIGKILLed (137) instead, so we were cutting the shutdown
    # off at under a third of what it needed and never seeing it finish.
    #
    # 90s because that is the ceiling the successful exit actually ran under
    # (systemd's DefaultTimeoutStopSec), rather than a number picked for feel.
    # Compose has been measured taking ~20s to deliver the signal at all on a
    # loaded pod, so 20 + 90 = 110s worst case, inside the 180s async ceiling on
    # the stop task in site.yaml with room to spare.
    #
    # This does not claim to fix the stop hanging (#355). It removes one ceiling
    # known to be set below a measured completion time.
    stop_grace_period: 90s
    privileged: true
    volumes:
      - /var/lib/campod/captures:/captures
      # Same reason as the camera service: a container's hostname is its
      # container ID, so the host's name has to be mounted in for the data to
      # know which pod it came from (#272).
      - /etc/hostname:/etc/host-hostname:ro
      # The card-image manifest, for the same reason and by the same route.
      # Both writers list it as a manifest source and copy it into each
      # session, but it lives on the host and was never mounted, so every
      # session so far logged `this session is unattributed` and recorded only
      # the payload half of the chain. If it is ever absent docker leaves an
      # empty directory here, which reads as the same unattributed log line.
      - /etc/fleet-image:/etc/fleet-image:ro
    environment:
      # Camera-to-arm-end baseline in metres, MEASURED per vehicle. Differential
      # acceleration over a known separation is the rotational signature, and it
      # is meaningless without this number -- 1 g across 150 mm at 120 Hz is
      # 0.41 px of image shift. Empty until it is measured on the airframe.
      CAMPOD_ACCEL_SEPARATION_M: ""
      CAMPOD_ACCEL_SYNC_KIB: "0"
    command: ["/opt/campod/campod-accel"]
