# As-built campod rig flying the map-test mission, ideal capture: global shutter, no blur, no
# noise, exact position priors. Rig, priors and scene are as in as-built.yaml.
#
# Lens: Arducam B0310 (IMX708, 4608x2592, 1.4 um pixels, fixed M12 lens). No measured intrinsics
# exist yet. The vendor gives 120 deg H x 66.7 deg V x 152 deg D and f = 2.87 mm; those do not fit
# one ideal projection. An equidistant fisheye at f = 2200 px gives 120 H / 67.5 V / 137.7 D,
# matching H and V; the nominal 2.87 mm (2050 px) would give 129 H as equidistant.
#
# Mounts: one camera at each corner of the 7.9 x 3.8 in cheese plate, long side fore-aft, looking
# outward at 45 deg off track, landscape. Each is pitched so the middle of its lower edge sees nadir:
# depression = 90 - half the vertical FOV (33.74) = 56.26. The 3 cm drop below the body origin is a
# placeholder.

rig:
  pixel_um: 1.4
  lenses:
    b0310:
      width: 4608
      height: 2592
      focal_px: 2200.0
      k: [0.0, 0.0, 0.0, 0.0]
  cameras:
    - {name: ne, lens: b0310, azimuth_deg: 45, depression_deg: 56.26, roll_deg: 0, position_m: [0.100, -0.048, -0.03]}
    - {name: se, lens: b0310, azimuth_deg: 135, depression_deg: 56.26, roll_deg: 0, position_m: [-0.100, -0.048, -0.03]}
    - {name: sw, lens: b0310, azimuth_deg: 225, depression_deg: 56.26, roll_deg: 0, position_m: [-0.100, 0.048, -0.03]}
    - {name: nw, lens: b0310, azimuth_deg: 315, depression_deg: 56.26, roll_deg: 0, position_m: [0.100, 0.048, -0.03]}

# The mission flown on 2026-10-30 (flights/rekon10/2026-10-30-auto), waypoints 2-13 at 30 m about
# its home, which is this scene's origin: 276 captures 3 m apart, 1104 images.
trajectory:
  kind: mission
  mission: ardupilot/map-test.waypoints
  speed_mps: 3
  capture_hz: 1          # campod-camera's capture rate at full resolution

priors:
  accuracy_m: [0.01, 0.01]

jpeg_quality: 95

# A house in a yard in the woods, rough and ready, centred on the mission's area (30.4 E, 20.0 S
# of home; the farthest waypoint is 93 m from there). The house is 12 x 9 m and 8 m tall with a
# Siemens star on each wall and the roof. Ten metres of open yard round it, then rings of
# 3 x 3 m, 15 m trees every 10 m out to 100 m, about 10 m apart round each ring, alternate rings
# offset half a step.
scene:
  sky: 0.85
  texture: {finest_m: 0.02, octaves: 9, slope: 0.0, contrast: 4.0, seed: 1}
  solids:
    - {kind: plane, height: 0.0}
    - {kind: box, base: [30.4, -20.0, 0], size: [12, 9, 8], decals: true}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 20, spacing_m: 10, size: [3, 3, 15]}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 30, spacing_m: 10, size: [3, 3, 15], offset_steps: 0.5}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 40, spacing_m: 10, size: [3, 3, 15]}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 50, spacing_m: 10, size: [3, 3, 15], offset_steps: 0.5}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 60, spacing_m: 10, size: [3, 3, 15]}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 70, spacing_m: 10, size: [3, 3, 15], offset_steps: 0.5}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 80, spacing_m: 10, size: [3, 3, 15]}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 90, spacing_m: 10, size: [3, 3, 15], offset_steps: 0.5}
    - {kind: box_ring, centre: [30.4, -20.0], radius: 100, spacing_m: 10, size: [3, 3, 15]}
