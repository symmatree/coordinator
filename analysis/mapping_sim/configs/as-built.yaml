# As-built campod rig, ideal capture: global shutter, no blur, no noise, exact position priors.
#
# Lens: Arducam B0310 (IMX708, 4608x2592, 1.4 um pixels, fixed M12 lens). No measured intrinsics
# exist yet. The vendor gives 120 deg H x 66.7 deg V x 152 deg D and f = 2.87 mm; those do not fit
# one ideal projection. An equidistant fisheye at f = 2200 px gives 120 H / 67.5 V / 137.7 D,
# matching H and V; the nominal 2.87 mm (2050 px) would give 129 H as equidistant.
#
# Mounts: one camera per arm at the arm-frame junction, looking outward along the arm.
# Depression, roll and position below are placeholders, not measurements of the airframe.

rig:
  pixel_um: 1.4
  lenses:
    b0310:
      width: 4608
      height: 2592
      focal_px: 2200.0
      k: [0.0, 0.0, 0.0, 0.0]
  cameras:
    - {name: ne, lens: b0310, azimuth_deg: 45, depression_deg: 45, roll_deg: 0, position_m: [0.08, -0.08, -0.03]}
    - {name: se, lens: b0310, azimuth_deg: 135, depression_deg: 45, roll_deg: 0, position_m: [-0.08, -0.08, -0.03]}
    - {name: sw, lens: b0310, azimuth_deg: 225, depression_deg: 45, roll_deg: 0, position_m: [-0.08, 0.08, -0.03]}
    - {name: nw, lens: b0310, azimuth_deg: 315, depression_deg: 45, roll_deg: 0, position_m: [0.08, 0.08, -0.03]}

trajectory:
  kind: lawnmower
  area_m: [-20, -20, 20, 20]
  height_m: 15
  line_spacing_m: 10
  speed_mps: 3
  capture_hz: 1          # campod-camera's capture rate at full resolution
  line_heading_deg: 0

priors:
  accuracy_m: [0.01, 0.01]

jpeg_quality: 95

scene:
  sky: 0.85
  texture: {finest_m: 0.02, octaves: 9, slope: 0.0, contrast: 4.0, seed: 1}
  solids:
    - {kind: plane, height: 0.0}
    - {kind: box, base: [-8, 6, 0], size: [6, 4, 3], yaw_deg: 20}
    - {kind: box, base: [9, -7, 0], size: [3, 3, 5], yaw_deg: -35}
    - {kind: box, base: [2, 12, 0], size: [8, 2, 1.5], yaw_deg: 0}
    - {kind: box, base: [-12, -10, 0], size: [2, 5, 2], yaw_deg: 60}
    - {kind: cylinder, x: 4, y: 0, radius: 0.4, z0: 0, z1: 6}
    - {kind: cylinder, x: -3, y: -6, radius: 1.5, z0: 0, z1: 2}
    - {kind: cylinder, x: 13, y: 9, radius: 0.25, z0: 0, z1: 8}
    - {kind: cylinder, x: -15, y: 14, radius: 0.8, z0: 0, z1: 4}
