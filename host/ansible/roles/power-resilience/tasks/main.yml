---
# Power-bounce resilience for every Rekon device. Both the coordinator and the
# campods run off the avionics 5 V rail, so every power-down is a yank and cold
# starts can brown out. These tasks leave a forensic trail that survives the
# reboot (#100). See docs/power-loss-filesystem.md.
#
# Shared, not coordinator-only. This was in roles/coordinator until now, so a
# campod kept its journal in /run and lost every log on the yank that ends each
# flight -- precisely the device class where an undervoltage trail is most useful,
# on the smaller PSU margin. That is the same reasoning this file already recorded
# for #97's auto-start unit: "it was never coordinator-specific, and the campod's
# lack of it was a real gap rather than a deliberate difference."
#
# Renamed with the move: 95-fleet-journal.conf and pi-throttle.{service,timer}. The
# old names (95-coordinator.conf, coordinator-throttle.*) described where the code
# lived rather than what it does, and a campod running something called
# "coordinator-throttle" is a puzzle for whoever reads systemctl next.
#
# No cleanup task for the old names. There is exactly one deployed coordinator and
# it is reflashed near-daily, so a stale unit outlives the rename by at most one
# card -- and the old drop-in sorts before the new one anyway, so even overlapping
# they do not fight.
#
# The 95- prefix IS load-bearing and survives the rename -- it has to sort after RPi
# OS's 40-rpi-volatile-storage.conf to win journald's last-value drop-in merge.

# --- #100: persist the journal so the post-bounce forensic trail survives reboot ---
# Two gotchas, both found on-hardware (bench 2026-07-24), that the first cut missed:
#  1. /etc/systemd/journald.conf.d does not exist by default here, and `copy` won't
#     create a dest's parent dir -- ensure it first or the task fails.
#  2. Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
#     forcing Storage=volatile (to spare the SD). Drop-ins merge in lexicographic order,
#     so ours must sort AFTER 40- to win -- hence the 95- prefix. journald creates
#     /var/log/journal itself once persistent wins, so we don't manage that dir.
- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Persist journald (bounded; 95- so it beats RPi OS's 40-rpi-volatile-storage.conf)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/95-fleet-journal.conf
    content: |
      # Post-crash/bounce forensics (#100). Bounded so persistence does not grow SD
      # write volume without limit. 95- sorts after RPi OS's 40-rpi-volatile-storage.conf
      # (Storage=volatile), so this wins the last-value merge.
      #
      # SyncIntervalSec is the window of log messages a power cut can take with it.
      # systemd defaults it to 5 minutes and exempts only CRIT/ALERT/EMERG, so ERR and
      # below sit in page cache until the timer fires -- on a fleet where every
      # shutdown is a yank, that is the forensic trail dying with the event that
      # caused it. See this role's defaults for the sizing argument.
      [Journal]
      Storage=persistent
      SystemMaxUse={{ power_resilience_journal_max_use }}
      SyncIntervalSec={{ power_resilience_journal_sync_interval }}
    mode: "0644"
  notify: Restart journald

# Drop the earlier 10- name if a prior deploy left it -- it lost to 40- and is dead now.
- name: Remove superseded 10- journald drop-in
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d/10-coordinator.conf
    state: absent
  notify: Restart journald

# --- forensics: log Pi undervoltage/throttle state on a timer ---
# vcgencmd is a Pi-hardware tool; install the timer only where it exists so we
# never ship a unit that just errors every tick.
- name: Detect vcgencmd (Pi power telemetry)
  ansible.builtin.shell: command -v vcgencmd
  register: vcgencmd_check
  changed_when: false
  failed_when: false

- name: Install throttle forensics timer (only where vcgencmd exists)
  when: vcgencmd_check.rc == 0
  block:
    - name: Install coord-throttle-log helper
      ansible.builtin.copy:
        src: "{{ repo_root }}/bin/coord-throttle-log"
        dest: /usr/local/bin/coord-throttle-log
        mode: "0755"

    - name: Install throttle service + timer units
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - pi-throttle.service
        - pi-throttle.timer
      # No notify: the next task runs daemon_reload immediately, whereas a handler
      # would not fire until the end of the play. It was always the daemon_reload
      # below doing the work, and dropping the notify keeps this role from having to
      # redeclare a "Reload systemd" handler that the coordinator role also defines.

    - name: Enable throttle timer
      ansible.builtin.systemd:
        name: pi-throttle.timer
        enabled: true
        state: started
        daemon_reload: true
