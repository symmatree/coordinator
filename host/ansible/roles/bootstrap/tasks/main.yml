---
# Get a device from "freshly flashed and reachable by SSH" to "ready for the rest
# of this playbook". This used to be host/one_time.sh, in bash, because ansible
# could not be the thing that installed ansible.
#
# It is a role now because the control node is no longer the device. Everything
# ansible needs on a virgin card is already in the image -- python3, sudo with
# passwordless, sshd -- so a just-flashed unit is manageable over SSH with nothing
# installed on it first, and the bootstrap ordering problem stops existing rather
# than being worked around.

# --- prerequisites -----------------------------------------------------------
# git is the only one of these missing from the image, and it is needed because
# /opt/stacks/<role> symlinks into a git checkout -- `git pull` IS the config
# deploy (#48). ca-certificates and curl are already present; named so a different
# base cannot quietly drop them.
#
# Note what is NOT here: ansible. With the control node off the device there is
# nothing to bootstrap it onto, which is what removed the last ordering problem --
# previously `apt install git` had to precede the clone, while the helper that
# made /usr writable lived inside the repo that clone produced.
# Stop fetching index data this device cannot use, BEFORE the first apt run --
# every `update_cache` below and in every other role pays for whatever is
# configured here.
#
# Translation-* indexes carry localized package descriptions and nothing
# functional. On a headless appliance consulting three archives, they are a
# meaningful share of an apt-get update that we can never read. That matters
# because the update is the expensive step: measured on campod-se, a converge that
# installed nothing at all still took over 20 minutes and took the device off the
# network, because the index fetch runs over a -64 dBm wifi link.
#
# Deliberately NOT disabling the DEP-11/appstream indexes here. Those are fetched
# because the `appstream` package ships its own apt.conf.d drop-in, so the lever is
# whether appstream is installed -- not a config key of ours. install_recommends:
# false makes it much less likely to arrive in the first place. Worth checking on a
# device rather than guessing at target names.
- name: Do not fetch translation indexes (nothing here reads them)
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-rekon-no-translations
    content: |
      // Managed by host/ansible/roles/bootstrap. Headless appliance: there is no
      // localized package description anyone will ever read here, and fetching
      // them is a share of the slowest step in a converge.
      Acquire::Languages "none";
    owner: root
    group: root
    mode: "0644"

# --- the Raspberry Pi archive ------------------------------------------------
# We install NOTHING from it. Walk the roles: bootstrap takes ca-certificates,
# curl and git from Debian; podman-host takes podman from Debian's own
# repo; metrics takes collectd-core from Debian; coordinator takes i2c-tools from
# Debian. power-resilience only DETECTS vcgencmd with `command -v` -- it never
# installs it. So the archive is consulted by every apt-get update and supplies
# nothing, and the index fetch is the expensive step: measured on campod-se, a
# converge that installed nothing at all still took over 20 minutes and took the
# device off the network, over a -64 dBm wifi link.
#
# Kernel and firmware DO come from it -- and they move by reflash, not by
# converge. #96 makes the OS version a property of the flashed image, and kernel
# and firmware are the most OS-ish things there are. So dropping the archive is
# the appliance model applied consistently, not a compromise.
#
# ORDER IS LOAD-BEARING: mark before removing. Once the source is gone, nothing
# can tell you which installed packages came from it, so the marking has to happen
# while its index is still on disk.
- name: Find installed packages that came from the Raspberry Pi archive
  # Only those currently marked AUTO, which is exactly the at-risk set: autoremove
  # will not touch a manual package. Marking only what is at risk keeps this from
  # pinning half the system as manual and defeating autoremove entirely.
  #
  # Prints nothing and exits 0 if the archive's index is absent -- which is the
  # signal the removal below keys on, so a card that has never run apt-get update
  # keeps its archive rather than losing the marking opportunity silently.
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      # NO_INDEX is the signal the removal below keys on. It must be
      # distinguishable from "index present, nothing auto-marked" -- both produce
      # no package names, but only one of them means it is safe to remove the
      # source. Printing nothing for both was the bug.
      idx=$(ls /var/lib/apt/lists/*raspberrypi*_Packages 2>/dev/null) || { echo NO_INDEX; exit 0; }
      [ -n "$idx" ] || { echo NO_INDEX; exit 0; }
      comm -12 \
        <(apt-mark showauto | sort -u) \
        <(awk '/^Package: /{print $2}' $idx | sort -u)
    executable: /bin/bash
  changed_when: false
  register: bootstrap_rpi_auto_pkgs

- name: Mark them manually installed, so autoremove cannot take them
  # Seth's call, and the better one: make "these are intentionally installed" a
  # TRUE and checkable fact rather than removing the autoremove that would notice.
  # Without this, the combination of a removed source (no candidate version) and
  # autoremove could take a package the box boots from.
  ansible.builtin.command:
    cmd: apt-mark manual {{ bootstrap_rpi_auto_pkgs.stdout_lines | join(' ') }}
  when:
    - "'NO_INDEX' not in bootstrap_rpi_auto_pkgs.stdout"
    - bootstrap_rpi_auto_pkgs.stdout_lines | length > 0
  changed_when: true

- name: Remove the Raspberry Pi archive from apt's sources
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/raspi.list
    - /etc/apt/sources.list.d/raspi.sources
  # Only once the marking above had a CHANCE to run -- i.e. the archive's index was
  # on disk, so the enumeration was meaningful.
  #
  # This was `stdout is defined`, which is true whenever the task ran at all,
  # because an empty string is still defined. So on a fresh card that had never run
  # apt-get update, the index was absent, nothing was enumerated, and the source
  # was removed anyway -- destroying the marking opportunity this is supposed to
  # protect, in exactly the case where it matters most. A fresh flash is when Pi
  # packages are most likely still auto-marked from the image build.
  #
  # With NO_INDEX the source survives and a later converge does the job: the
  # `Install prerequisites` update below populates the index, so the NEXT run
  # marks and removes. One extra archive fetch, once, in exchange for never
  # removing the source blind.
  when: "'NO_INDEX' not in bootstrap_rpi_auto_pkgs.stdout"

# NO APT IN A STEADY-STATE CONVERGE. The packages come from the image --
# pi-image/roles/<role>.env's APT_INSTALL in dotfiles-symm -- so there is nothing here to
# install and nothing to refresh for. Six roles were each running an apt install, five of
# them for packages the image already had: no-ops that still paid an apt invocation, which
# on a Zero over WiFi is the slowest thing we do.
#
# The image is the floor. A card flashed from one that predates a package does not get it
# from a converge; it gets reflashed. That is the same rule as device tree, and it is why
# this asserts rather than installs -- a missing binary should name the image, not be
# quietly papered over at converge time with a different version than every other card.
- name: Check the image provided the host package set
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: bootstrap_provided
  loop: "{{ host_requires + host_requires_by_role[device_role] }}"
  loop_control:
    label: "{{ item.package }}"
  check_mode: false

- name: Fail naming the image, if it did not
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      {{ item.item.path }} is missing, so this card's image does not carry
      {{ item.item.package }}. Add it to APT_INSTALL in
      dotfiles-symm pi-image/roles/{{ device_role }}.env and reflash -- a converge does not
      install packages.
  loop: "{{ bootstrap_provided.results }}"
  loop_control:
    label: "{{ item.item.package }}"

# Only when something is actually going to use it. A normal converge makes no apt call at
# all; this is the one path that does, and it is opt-in.
- name: Refresh the apt index for the upgrade
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ apt_cache_max_age }}"
  when:
    - ansible_os_family == "Debian"
    - dist_upgrade | bool

# In-place OS upgrade, off by default. Was a separate playbook
# (host/ansible/os-upgrade.yaml); folded in here because keeping it separate meant
# duplicating the hatch and the reboot-and-wait, and it silently missed the capture
# quiesce and the --check refusal. A dist-upgrade is the heaviest thing we run, so
# running it against a live capture was the worst case of the contention we spend
# effort avoiding.
#
# A role rather than provision.yaml's `tasks:`, which runs AFTER all roles -- the rest
# would converge on the old packages and then upgrade them.
- name: Upgrade all packages (dist_upgrade)
  # A dist-upgrade is far more likely than a fresh install to hit a debconf prompt
  # (maintainer scripts asking about changed conffiles), and there is no tty on a
  # pushed run. force_apt_get because the ansible apt module's default aptitude
  # path is not installed on these images.
  #
  # No install_recommends here: it applies to new installs, and constraining an
  # upgrade with it can hold packages back.
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
    force_apt_get: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: bootstrap_dist_upgrade
  when: dist_upgrade | bool

- name: Remove packages no longer required (dist_upgrade)
  ansible.builtin.apt:
    autoremove: true
    force_apt_get: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  when: dist_upgrade | bool
