---
# Pod (Pi Zero 2 W) specifics: the pod stack and state dirs so the Zero is
# container-ready. Node bring-up and maintenance: docs/campod.md.
#
# Nothing here writes /boot/firmware, deliberately. Device tree comes from the
# campod image (dotfiles-symm/pi-image/roles/campod/config.append.txt) -- serial
# console, dwc2 for the gadget net, and dtparam=spi=on for the ADXL345 bus. The
# boot partition is FAT on an SD card in a vehicle that loses power abruptly: no
# checksums, no CoW, none of the protection the btrfs subvolumes give the rest of
# the disk. "The image writes it, nothing else does" is worth keeping as an
# invariant, and it also spares every unit a guaranteed reboot during bootstrap.
#
# Module LOADING is still ansible's (dwc2/g_ether via /etc/modules-load.d/), along
# with the g_ether MAC pinning in /etc/modprobe.d/ -- see docs/campod.md.

- name: Install pod stack and state dirs
  ansible.builtin.include_role:
    name: coord-stack
  vars:
    coord_stack_name: pod
    coord_state_root: /var/lib/pod
    coord_state_subdirs:
      - config
      - captures
