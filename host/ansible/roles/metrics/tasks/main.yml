---
# collectd's configuration. Deploy: the template changes with the repo. The package
# and the DataDir helper are roles/collectd-install.
# System metrics for post-flight forensics (#25, #41). Applies to every Rekon
# device: the coordinator and the campods run off the same avionics 5 V rail, off
# the same kind of SD card, and lose power the same way.
#
# WHY collectd AND NOT AN EXPORTER. An exporter only exposes; something has to
# scrape and store it, and on-vehicle that store is the expensive half -- a
# Prometheus/Mimir on a 512 MB Zero is not on the table. collectd is one C daemon
# that samples and writes, which is the whole job here.
#
# WHY NOT THE NETWORK. The vehicle drops wifi in flight on purpose: connectivity
# must not be able to destabilise VIO (an unattended apt during a flight is the
# concrete worry). The gadget net that could carry metrics off a pod is #12/#24 and
# is not stood up. So this writes locally and nothing scrapes it -- the samples are
# a per-flight artifact, copied off afterwards the way the journal already is.
#
# WHY CSV AND NOT RRD. collectd's usual pairing is RRD, and RRD is the wrong shape
# twice over here. Its round-robin design solves "keep years of history in fixed
# space on a long-lived box"; what we want is full resolution for one flight, then
# copied off. And it updates in place, small and random, which is the pathological
# write pattern on CoW btrfs -- every update forks an extent plus metadata. Appends
# are sequential, need no nodatacow exemption, and compress under the zstd already
# on @var. They are also a plain text file that drops into flights/<id>/ next to
# ground/backpack-link.jsonl, which is already the per-flight artifact convention.

# No age bound on the samples. The only thing that enforced one was
# systemd-tmpfiles-clean.timer, now masked with the other scheduled maintenance: it
# aged files by an mtime that every boot writes on the image's build epoch until
# chrony steps the clock. A boot's tree (the DataDir below is per boot id) is session
# data: `coord-sessions package` bundles it and `coord-sessions delete` removes it. This
# removes the rule from cards that were converged while it existed.
- name: Remove the collectd age bound
  ansible.builtin.file:
    path: /etc/tmpfiles.d/collectd-csv.conf
    state: absent

# collectd-core ships NO /etc/collectd/collectd.conf -- only an example under
# /usr/share/doc. Its unit carries ConditionPathExists=/etc/collectd/collectd.conf,
# so without this file the service does not fail, it silently does not run: enabled,
# no error, no samples. Hence config before enable, never the other way round.
# (Read out of collectd-core_5.12.0-14_arm64.deb; ExecStartPre runs ,
# so a malformed config does fail loudly rather than running on defaults.)
# Whether to collect chrony stats is decided by whether chronyd is here, not by role:
# the coordinator has it now and the pods get it with #370/#24, and this way that
# needs no edit. A stat, so it runs under --check too.
- name: Look for chronyd
  ansible.builtin.stat:
    path: /usr/sbin/chronyd
  register: metrics_chronyd
  check_mode: false

- name: Look for collectd's chrony plugin
  ansible.builtin.stat:
    path: /usr/lib/collectd/chrony.so
  register: metrics_chrony_plugin
  check_mode: false

# Loud rather than quiet. The whole question was whether chrony stats are available
# without spawning shell commands every interval; if Debian did not build the plugin,
# the answer is no and that is worth knowing at converge rather than discovering an
# empty graph later.
- name: Fail if chronyd is installed but collectd cannot read it
  ansible.builtin.assert:
    that: metrics_chrony_plugin.stat.exists
    fail_msg: >-
      chronyd is installed but /usr/lib/collectd/chrony.so is not, so collectd cannot
      read chrony over its native protocol. The alternative is shelling out to chronyc
      on every interval, which is not worth it on these boxes -- decide before adding
      it rather than letting the config silently collect nothing.
  when: metrics_chronyd.stat.exists

- name: Configure collectd
  ansible.builtin.template:
    src: collectd.conf.j2
    dest: /etc/collectd/collectd.conf
    mode: "0644"
  notify: Restart collectd

- name: Enable collectd
  ansible.builtin.systemd:
    name: collectd.service
    enabled: true
    state: started
    daemon_reload: true
