---
# The container runtime, shared by both device roles. podman with no daemon: the
# payload runs as systemd services generated from the quadlet units in stacks/.
# Why podman rather than Docker: docs/deployment-model.md, #449.

- name: Assert arm64 host for container images
  ansible.builtin.assert:
    that:
      - ansible_architecture == "aarch64"
    fail_msg: >-
      Coordinator/campod images are linux/arm64. Install 64-bit Raspberry Pi OS.

# Docker is removed, not merely left uninstalled: a converged device already has it
# running, and the point of #449 is that it is not resident.
- name: Stop and disable Docker
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - docker.socket
    - docker.service
    - containerd.service
  # Absent is the wanted end state, so a unit that is not there is not a failure.
  failed_when: false

- name: Remove Docker
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
      # The distro packages too, in case a device was set up before the vendor repo.
      - docker-compose
      - docker.io
    state: absent
    purge: true
    autoremove: true
  register: podman_host_docker_removed

# So it cannot come back on the next apt upgrade.
- name: Remove the Docker apt repository and keyring
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/keyrings/docker.asc

- name: Remove the docker group
  ansible.builtin.group:
    name: docker
    state: absent

# /var/lib/docker is left: purge does not remove it, and on these cards it is a btrfs
# subvolume whose layout belongs to the image (dotfiles-symm). Stale image layers there
# cost disk, not memory.

- name: Install podman
  ansible.builtin.apt:
    install_recommends: false
    name:
      # Brings the quadlet generator and crun.
      - podman
      # podman warns without it; unused while the payload containers are rootful.
      - uidmap
    state: present
    update_cache: false
  when: ansible_os_family == "Debian"
  # site.yaml's reboot keys on whether this run installed anything.
  register: podman_host_pkgs

# Read by the quadlet generator at boot and on every daemon-reload.
- name: Ensure the quadlet unit directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"

# The quadlet units name every image in full, so there is nothing to search for.
- name: Require fully-qualified image names
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/010-rekon.conf
    mode: "0644"
    content: |
      unqualified-search-registries = []

# No daemon to enable and no group to add anyone to. site.yaml's post_tasks own the
# reboot.
