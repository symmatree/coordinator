---
# The host tools in /usr/local/bin. Copied from the checkout, which is why this runs
# in deploy rather than provision: provision has no checkout yet.
#
# Needs roles/usr-rw ahead of it: docs/deployment-model.md, "The /usr hatch".

- name: Ensure /usr/local/bin exists
  ansible.builtin.file:
    path: /usr/local/bin
    state: directory
    mode: "0755"

- name: Install the host tools
  ansible.builtin.copy:
    remote_src: true
    src: "{{ coord_checkout }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    mode: "0755"
    # Replaces a symlink left by an earlier converge rather than writing through it.
    follow: false
  loop:
    - coord
    - coord-fc-log
    - coord-radio
    - coord-sessions
    - coord-throttle-log
    - coord-version
    - vio-ipc-record
    - vio-pose-tap
