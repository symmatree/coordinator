---
# The coordinator's configuration and stack. Deploy. Hardware and OS wiring is
# roles/coordinator-hardware.
# Coordinator (Pi 4B) specifics: the host devices the stack binds, then the stack.
# Behavior matches the former install-coordinator.yaml.

# import_role, not include_role: a static import lets coord-stack's own task tags do the
# filtering. A dynamic include's tags are inherited by everything inside it.
- name: Install coordinator stack and state dirs
  ansible.builtin.import_role:
    name: coord-stack
  vars:
    coord_stack_name: coordinator
    coord_state_root: /var/lib/coordinator
    coord_state_subdirs:
      - config
      - ipc
      # OAK-D captures (disparity + stills): the in-tracker capture branch
      # bind-mounts this as /captures (#72).
      - captures

# Seed the vins_fusion calibration. force: false so a flight-refined oak_d.yaml
# on the Pi survives re-provisioning (it is a starting calibration -- see the
# file header and docs/bench-estimator.md).
- name: Seed OAK-D VINS calibration (does not overwrite local refinement)
  tags: stack
  ansible.builtin.copy:
    src: oak_d.yaml
    dest: /var/lib/coordinator/config/oak_d.yaml
    mode: "0644"
    force: false
