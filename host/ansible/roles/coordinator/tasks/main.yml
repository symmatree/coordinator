---
# The coordinator's configuration and stack. Deploy. Hardware and OS wiring is
# roles/coordinator-hardware.
# Coordinator (Pi 4B) specifics: the host devices the stack binds, then the stack.
# Behavior matches the former install-coordinator.yaml.

- name: Install coordinator stack and state dirs
  ansible.builtin.include_role:
    name: coord-stack
  vars:
    coord_stack_name: coordinator
    coord_state_root: /var/lib/coordinator
    coord_state_subdirs:
      - config
      - ipc
      # OAK-D captures (disparity + stills): the in-tracker capture branch
      # bind-mounts this as /captures (#72).
      - captures

# Seed the vins_fusion calibration. force: false so a flight-refined oak_d.yaml
# on the Pi survives re-provisioning (it is a starting calibration -- see the
# file header and docs/bench-estimator.md).
- name: Seed OAK-D VINS calibration (does not overwrite local refinement)
  ansible.builtin.copy:
    src: oak_d.yaml
    dest: /var/lib/coordinator/config/oak_d.yaml
    mode: "0644"
    force: false

# The DS3234's square-wave output is off until something writes its control
# register, and with no kernel driver bound there is nothing else to do it -- see
# coordinator#11 for why the driver is deliberately not bound. Written every boot
# rather than once: the register is battery-backed and would hold, but then the
# PPS line's existence rests on a coin cell nobody is watching, and a silent chip
# looks exactly like a working one.
#
# Here rather than in provision because it runs the CLI, which roles/host-cli
# installs in this play.
- name: Install the DS3234 units
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - coord-rtc-pps.service
    # Sets the system clock from the chip before chronyd starts, so the box has a
    # plausible time from boot rather than from whatever systemd last saved.
    - coord-rtc-clock.service

- name: Enable the DS3234 units
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop:
    - coord-rtc-pps.service
    - coord-rtc-clock.service
