---
- name: Reload udev rules
  ansible.builtin.command: udevadm control --reload-rules
  notify: Trigger udev

- name: Trigger udev
  ansible.builtin.command: udevadm trigger

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart journald
  # Restart to pick up Storage=persistent, then flush /run -> /var/log/journal so the
  # forensic trail is live immediately, not only after the next reboot (#100).
  ansible.builtin.shell: systemctl restart systemd-journald && journalctl --flush
  changed_when: true

- name: Reload NetworkManager connections
  ansible.builtin.command: nmcli connection reload
  changed_when: true
  failed_when: false
