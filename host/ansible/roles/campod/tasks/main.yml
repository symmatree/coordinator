---
# The campod's configuration and stack. Deploy. Hardware and OS wiring is
# roles/campod-hardware.
# Campod (Pi Zero 2 W) specifics: the campod stack and state dirs so the Zero is
# container-ready. Node bring-up and maintenance: docs/campod.md.
#
# Nothing here writes /boot/firmware, deliberately. Device tree comes from the
# campod image (dotfiles-symm/pi-image/roles/campod/config.append.txt) -- serial
# console, dwc2 for the gadget net, and dtparam=spi=on for the ADXL345 bus. The
# boot partition is FAT on an SD card in a vehicle that loses power abruptly: no
# checksums, no CoW, none of the protection the btrfs subvolumes give the rest of
# the disk. "The image writes it, nothing else does" is worth keeping as an
# invariant, and it also spares every unit a guaranteed reboot during bootstrap.
#
# Module LOADING is still ansible's (dwc2/g_ether via /etc/modules-load.d/), along
# with the g_ether MAC pinning in /etc/modprobe.d/ -- see docs/campod.md.

# The image mounts the @data btrfs subvolume at coord_state_root. Those two names
# have to agree across two repos, and when they don't, nothing errors: captures
# just land on @var instead of the capture subvolume, and the power-loss
# properties @data exists for quietly stop applying. It is invisible until
# somebody runs findmnt.
#
# That divergence is live right now, in exactly one direction: a card flashed from
# an image predating the /var/lib/pod -> /var/lib/campod rename, running a checkout
# from after it. Cheap to detect and worth failing on -- findmnt only succeeds here
# if something really is mounted at the old path, so it cannot fire on a coordinator
# or a dev box that simply has no @data.
#
# check_mode: false is load-bearing, not tidiness. A `command` task skipped by
# check mode still registers `rc: 0` -- Ansible fills in a SUCCESS value beside
# `skipped: True`:
#
#   {'changed': False, 'rc': 0, 'skipped': True,
#    'msg': 'Command would have run if not in check mode', ...}
#
# so `when: ...rc == 0` below was unconditionally true under --check. The effect
# was not a harmless skip: `ansible-playbook --check` on any campod aborted with
# the message below and told the operator to reflash a perfectly good card.
# Verified on campod-se, where findmnt really returns rc=1 and /var/lib/campod is
# correctly mounted from /dev/mmcblk0p2[/@data]. Reading a mount table is a pure
# read, so running it in check mode is also the honest thing to do.
- name: Check whether @data is still mounted at the pre-rename path
  tags: stack
  ansible.builtin.command: findmnt -n -o TARGET /var/lib/pod
  register: campod_stale_data_mount
  changed_when: false
  failed_when: false
  check_mode: false

- name: Fail if the image and this checkout disagree about the state path
  tags: stack
  ansible.builtin.fail:
    msg: >-
      /var/lib/pod is a mountpoint, but this checkout puts campod state at
      /var/lib/campod. The card was flashed from an image predating that rename.
      Bootstrapping anyway would create /var/lib/campod on @var and captures would
      silently miss the @data subvolume. Reflash from an image carrying
      DATA_MOUNT=/var/lib/campod (dotfiles-symm/pi-image/roles/campod.env), or
      check out a commit from before the rename. Do not mix the two.
  when: campod_stale_data_mount.rc == 0

# import_role, not include_role: a static import lets coord-stack's own task tags do the
# filtering. A dynamic include's tags are inherited by everything inside it.
- name: Install campod stack and state dirs
  ansible.builtin.import_role:
    name: coord-stack
  vars:
    coord_stack_name: campod
    coord_state_root: /var/lib/campod
    coord_state_subdirs:
      - config
      - captures
