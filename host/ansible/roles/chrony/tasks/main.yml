---
# chrony on every device. The contract is docs/time-base.md; in short, the coordinator's
# seconds source is the DS3234 and the pods' is the coordinator, with each device taking
# the phase off its own leg of the one 1 Hz edge.
#
# A consequence worth stating so it does not read as a gap: with no kernel RTC bound there
# is no /dev/rtc, so chrony's rtcsync, rtcfile and rtcautotrim are all unavailable and a
# Pi 4B has no other RTC. That is why reading and writing the chip are coord-rtc
# subcommands rather than chrony settings.
#
# Deploy rather than provision, because the config changes with the repo and because the
# coordinator's half depends on coord-rtc, which roles/host-cli installs in this play. The
# package comes from the image -- see group_vars/all.yml.

- name: Ensure the chronyd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/chronyd.service.d
    state: directory
    mode: "0755"

# The `allow` line derives the network address by zeroing the last octet, which is only
# right for a /24. Asserted rather than assumed, because the failure would be a subnet
# that silently does not cover the pods.
- name: Fail if the gadget network is not a /24
  ansible.builtin.assert:
    that: campod_gadget_prefix | int == 24
    fail_msg: >-
      campod_gadget_prefix is {{ campod_gadget_prefix }}, and the chrony config derives
      the network address for `allow` by zeroing the last octet of
      campod_gadget_coordinator_ip, which only holds for a /24.
  when: device_role == 'coordinator'

# THE WHOLE FILE, replacing the vendor's. Debian's chrony.conf declares an upstream pool
# and two sourcedirs, and a conf.d drop-in can only add directives -- so a drop-in cannot
# give this design the single seconds source it is built around. The template says more.
- name: Install chrony.conf
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    mode: "0644"
  notify: Restart chronyd

# Nothing should be reading conf.d now, but a file left there from an earlier converge
# would still be read and would still add a source.
- name: Remove the superseded conf.d drop-in
  ansible.builtin.file:
    path: /etc/chrony/conf.d/10-rekon.conf
    state: absent
  notify: Restart chronyd

# pps_gpio is a module in these images, so /dev/pps0 is created by udev. A refclock whose
# device is missing when chronyd starts is a source that never appears.
- name: Order chronyd after the PPS device
  ansible.builtin.copy:
    src: chronyd-pps-device.conf
    dest: /etc/systemd/system/chronyd.service.d/10-pps-device.conf
    mode: "0644"
  notify: Restart chronyd

# Coordinator only: it is the device with the chip on SPI.
# chrony ships this and nothing enables it by default. It runs
# `chronyc waitsync 0 0.1 0.0 1` -- poll every second until the remaining correction is
# under 0.1 s -- with TimeoutStartSec=180, and it is `Before=time-sync.target` and
# `Wants=time-sync.target`, so enabling it is what makes that target mean anything on
# these boxes. Before this, time-sync.target appeared in no boot's journal at all.
#
# WHY CAPTURE NEEDS IT. These boards have no RTC, so a boot starts on the image's build
# epoch and chrony steps the clock ~186 days once the gadget link is up. Measured on
# campod-se: capture started 74 s before that step, and libcamera's camera-sync -- which
# is computed in WALL CLOCK -- ran through it. See the ordering on the campod capture
# units, and roles/chrony's own notes on the time path.
#
# A 180 s timeout still activates time-sync.target, because `Before=` is ordering and not
# a requirement. So the failure mode is capture starting late on an unsynchronised clock,
# never capture not starting -- which is what a pod with a dead gadget link needs.
- name: Enable chrony's wait-for-sync unit, which gates capture
  ansible.builtin.systemd:
    name: chrony-wait.service
    enabled: true
    daemon_reload: true

- name: Install the DS3234 feed unit
  ansible.builtin.template:
    src: coord-rtc-feed.service.j2
    dest: /etc/systemd/system/coord-rtc-feed.service
    mode: "0644"
  when: device_role == 'coordinator'

- name: Enable chronyd
  ansible.builtin.systemd:
    name: chronyd.service
    enabled: true
    daemon_reload: true

- name: Enable the DS3234 feed
  ansible.builtin.systemd:
    name: coord-rtc-feed.service
    enabled: true
    daemon_reload: true
  when: device_role == 'coordinator'
