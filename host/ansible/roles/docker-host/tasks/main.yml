---
# Shared across coordinator (Pi 4B) and campod (Pi Zero 2 W): Docker engine,
# group membership, service, and the kernel/firmware reboot loop. No
# device-specific paths or hardware here -- that lives in the device roles.

- name: Assert arm64 host for container images
  ansible.builtin.assert:
    that:
      - ansible_architecture == "aarch64"
    fail_msg: >-
      Coordinator/campod images are linux/arm64. Install 64-bit Raspberry Pi OS.

- name: Install packages for Docker apt repo
  ansible.builtin.apt:
    install_recommends: false
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Add Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  when: ansible_os_family == "Debian"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_architecture | replace('aarch64', 'arm64') | replace('x86_64', 'amd64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present
  when: ansible_os_family == "Debian"

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    install_recommends: false
    name:
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"
  # See the note on bootstrap_prereqs: site.yaml's reboot keys on whether this
  # run actually installed anything.
  register: docker_host_pkgs

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add operator user to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# No reboot task here: site.yaml's post_tasks own it, and now actually perform it.
# #113 had to remove auto-reboot because the play ran locally on the device, where
# ansible.builtin.reboot refuses outright rather than rebooting its own control node.
# Driven from another machine that constraint is gone -- the play reboots and waits,
# so a pending kernel/firmware change is applied within the run instead of being
# reported to someone who has to come back and finish it.
