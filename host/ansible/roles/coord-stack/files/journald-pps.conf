# journald for the "pps" namespace (coordinator#11), used by coord-pps-log.
#
# Its own store so a 1 Hz stream cannot crowd out the post-bounce forensic trail in the
# main journal (#100), which is capped separately at 200M by roles/power-resilience.
#
# 64M against roughly 20-25 MB/day gives a few days of edges, which is more than a
# session: the vehicle is powered in sessions and the power is pulled between them, so
# this does not need to hold a week.
#
# Same sync bound as the main journal: on a fleet where every shutdown is a yank, the
# window of lines a cut can take with it is what matters, not throughput.
#
# STORAGE IS STATED HERE AND MUST STAY, even though it looks redundant with the
# fleet-wide setting. roles/power-resilience makes journald persistent through
# /etc/systemd/journald.conf.d/95-fleet-journal.conf, and a drop-in there reaches the
# MAIN instance only -- journald.conf(5) gives a namespace its own journald@<ns>.conf
# and journald@<ns>.conf.d/. Without this line the namespace would fall back to the
# built-in Storage=auto and be persistent only because /var/log/journal happens to
# exist, which it does only because the main instance created it. A namespace that
# quietly went volatile looks identical to a working one: journalctl --namespace=pps
# still answers, the lines are still there, and they do not survive the power cut the
# sync bound above exists for.
#
# This is the mirror image of the gotcha roles/power-resilience already records, where
# the vendor put Storage=volatile in the main file rather than in a drop-in.
#
# Verifiable on a device two ways:
#   systemd-analyze cat-config systemd/journald@pps.conf   what the instance resolves
#   ls -d /var/log/journal/*.pps                           on disk, not in /run
[Journal]
Storage=persistent
SystemMaxUse=64M
SyncIntervalSec=10s
