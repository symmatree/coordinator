# journald for the "pps" namespace (coordinator#11), used by coord-pps-log.
#
# Its own store so a 1 Hz stream cannot crowd out the post-bounce forensic trail in the
# main journal (#100), which is capped separately at 200M by roles/power-resilience.
#
# 64M against roughly 20-25 MB/day gives a few days of edges, which is more than a
# session: the vehicle is powered in sessions and the power is pulled between them, so
# this does not need to hold a week.
#
# Same sync bound as the main journal: on a fleet where every shutdown is a yank, the
# window of lines a cut can take with it is what matters, not throughput.
[Journal]
Storage=persistent
SystemMaxUse=64M
SyncIntervalSec=10s
