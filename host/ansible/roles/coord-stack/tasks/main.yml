---
# Shared stack installer used by both device roles. Creates the device state dirs,
# points /opt/stacks/<name> at the stack definition, installs the quadlet units and the
# stack target, and pulls the images. Caller sets coord_stack_name, coord_state_root,
# coord_state_subdirs.
#
# Reads coord_checkout -- the DEVICE's own checkout -- and fails loudly without it.
# Which of these are copies and which are symlinks, and why: docs/deployment-model.md.

- name: Create {{ coord_stack_name }} state directories
  ansible.builtin.file:
    path: "{{ coord_state_root }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ coord_state_subdirs }}"

- name: Ensure the /opt/stacks root exists
  ansible.builtin.file:
    path: /opt/stacks
    state: directory
    mode: "0755"

# `file: state=link` will not replace a non-empty directory, so a stale copied dir from an
# older deploy is removed first.
- name: Stat the stack path ({{ coord_stack_name }})
  ansible.builtin.stat:
    path: "/opt/stacks/{{ coord_stack_name }}"
  register: coord_stack_path

- name: Remove a stale copied stack directory ({{ coord_stack_name }})
  ansible.builtin.file:
    path: "/opt/stacks/{{ coord_stack_name }}"
    state: absent
  when:
    - coord_stack_path.stat.exists | default(false)
    - coord_stack_path.stat.isdir | default(false)
    - not (coord_stack_path.stat.islnk | default(false))

- name: Symlink /opt/stacks/{{ coord_stack_name }} to the checkout
  ansible.builtin.file:
    path: "/opt/stacks/{{ coord_stack_name }}"
    src: "{{ coord_checkout }}/stacks/{{ coord_stack_name }}"
    state: link
    force: true

# podman's generator turns each .container into a .service at boot and on daemon-reload;
# each is WantedBy the stack target, so enabling the target is what makes the stack come
# up.
- name: Find this stack's quadlet units
  ansible.builtin.find:
    paths: "{{ coord_checkout }}/stacks/{{ coord_stack_name }}"
    patterns: "*.container"
  register: coord_stack_units

- name: Fail if the stack carries no quadlet units
  ansible.builtin.assert:
    that: coord_stack_units.files | length > 0
    fail_msg: >-
      No *.container files under {{ coord_checkout }}/stacks/{{ coord_stack_name }}.
      A converge that installs no containers leaves a device that cannot do its job,
      which is worse than failing here.

# COPIED, not symlinked. podman's generator reads this directory before
# local-fs.target, and the checkout is on the @home subvolume, so a symlink into it
# dangles at generator time -- which produces no units at all, exit 0, no output.
# Anything read during boot has to be a real file on /.
#
# follow: false so an existing symlink from an earlier converge is replaced rather
# than written through.
- name: Install the quadlet units into /etc/containers/systemd
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item.path }}"
    dest: "/etc/containers/systemd/{{ item.path | basename }}"
    mode: "0644"
    follow: false
  loop: "{{ coord_stack_units.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# A real file for the same reason as the units above: systemd has to load it at boot.
- name: Install the {{ coord_stack_name }} stack target
  ansible.builtin.copy:
    remote_src: true
    src: "{{ coord_checkout }}/stacks/{{ coord_stack_name }}/{{ coord_stack_name }}-stack.target"
    dest: "/etc/systemd/system/{{ coord_stack_name }}-stack.target"
    mode: "0644"
    follow: false

# daemon_reload rather than a handler: coord-stack is reached through include_role from
# both device roles. The reload is also what runs the quadlet generator.
- name: Enable {{ coord_stack_name }}-stack.target on boot
  ansible.builtin.systemd:
    name: "{{ coord_stack_name }}-stack.target"
    enabled: true
    daemon_reload: true

- name: Pull the stack images
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      grep -h '^Image=' /opt/stacks/{{ coord_stack_name }}/*.container
      | cut -d= -f2- | sort -u
      | xargs -r -n1 podman pull --quiet
    executable: /bin/bash
  register: coord_stack_pull
  # podman pull prints the image id on a fetch and a cache hit alike, so there is
  # nothing to key "changed" on. Nothing downstream reads it.
  changed_when: false

# Not followed by a start. The play ends by rebooting and the boot unit brings the
# stack up.
#
# Starting it here restarted capture in the MIDDLE of maintenance, with eighteen
# further tasks then competing with a pod writing full-resolution JPEGs to the same
# card -- and a start has itself been measured at 3m33s and 3m54s with a sustained
# ~20 MiB/s read storm (analysis/pi-zero-unresponsiveness-experiments.md).
#
# "Stop is not a sticky off" means the reboot brings it back, not that the play
# restarts it in place.
