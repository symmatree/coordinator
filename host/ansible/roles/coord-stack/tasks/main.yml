---
# Shared stack installer used by both device roles. Creates the device state dirs,
# **symlinks** /opt/stacks/<name> to the checkout so `git pull` is the deploy (no copy,
# no drift -- #48), and installs the shared coord CLI. Caller sets coord_stack_name,
# coord_state_root, coord_state_subdirs.
#
# None of this is optional. It used to hang off a sync_repo flag, from when these were
# copies out of the CONTROL NODE's repo and a box without that repo needed them off.
# Everything here now reads the DEVICE's own checkout with remote_src, so the flag's
# reason went away with repo_src and only the footgun was left: it defaulted to false,
# nothing set it once one_time.sh was deleted, and a converge that forgot it installed
# the runtime and collectd and then silently skipped the CLI, the symlink, the unit
# install and the image pull. A half-converged device is not a state worth having a
# flag for. If
# coord_checkout is missing these fail loudly, which is the correct outcome.
#
# coord_checkout is the DEVICE's checkout. Both the /opt/stacks symlink and the
# coord CLI come from it, so the CLI can never drift from the stack config it
# manages -- they are the same tree, at the same commit, by construction.

- name: Create {{ coord_stack_name }} state directories
  ansible.builtin.file:
    path: "{{ coord_state_root }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ coord_state_subdirs }}"

- name: Ensure the /opt/stacks root exists
  ansible.builtin.file:
    path: /opt/stacks
    state: directory
    mode: "0755"

# Deploy = symlink, not copy. The old copy silently reverted on-box edits and let deployed
# state diverge from the repo (#48). A symlink makes `git pull` the deploy: the deployed
# compose.yaml IS the repo's, by construction, and coord's /opt/stacks/*/compose.yaml glob
# resolves through it. `file: state=link` will not replace a non-empty directory, so a stale
# copied dir from a pre-symlink deploy is removed first.
- name: Stat the stack path ({{ coord_stack_name }})
  ansible.builtin.stat:
    path: "/opt/stacks/{{ coord_stack_name }}"
  register: coord_stack_path

- name: Remove a stale copied stack directory ({{ coord_stack_name }})
  ansible.builtin.file:
    path: "/opt/stacks/{{ coord_stack_name }}"
    state: absent
  when:
    - coord_stack_path.stat.exists | default(false)
    - coord_stack_path.stat.isdir | default(false)
    - not (coord_stack_path.stat.islnk | default(false))

- name: Symlink /opt/stacks/{{ coord_stack_name }} to the checkout
  ansible.builtin.file:
    path: "/opt/stacks/{{ coord_stack_name }}"
    src: "{{ coord_checkout }}/stacks/{{ coord_stack_name }}"
    state: link
    force: true

# The quadlet units, symlinked so `git pull` is the deploy (#48). podman's generator
# turns each into a .service at boot and on daemon-reload; each is WantedBy the stack
# target, so enabling the target is what makes the stack come up.
- name: Find this stack's quadlet units
  ansible.builtin.find:
    paths: "{{ coord_checkout }}/stacks/{{ coord_stack_name }}"
    patterns: "*.container"
  register: coord_stack_units

- name: Fail if the stack carries no quadlet units
  ansible.builtin.assert:
    that: coord_stack_units.files | length > 0
    fail_msg: >-
      No *.container files under {{ coord_checkout }}/stacks/{{ coord_stack_name }}.
      A converge that installs no containers leaves a device that cannot do its job,
      which is worse than failing here.

- name: Symlink the quadlet units into /etc/containers/systemd
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ item.path | basename }}"
    src: "{{ item.path }}"
    state: link
    force: true
  loop: "{{ coord_stack_units.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Symlink the {{ coord_stack_name }} stack target
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ coord_stack_name }}-stack.target"
    src: "{{ coord_checkout }}/stacks/{{ coord_stack_name }}/{{ coord_stack_name }}-stack.target"
    state: link
    force: true

# daemon_reload rather than a handler: coord-stack is reached through include_role from
# both device roles. The reload is also what runs the quadlet generator.
- name: Enable {{ coord_stack_name }}-stack.target on boot
  ansible.builtin.systemd:
    name: "{{ coord_stack_name }}-stack.target"
    enabled: true
    daemon_reload: true

- name: Install coord CLI
  ansible.builtin.copy:
    remote_src: true
    src: "{{ coord_checkout }}/bin/coord"
    dest: /usr/local/bin/coord
    mode: "0755"

# The device-side half of the status screen (#326). Installed next to coord
# because `coord version` execs it, and separately callable so the platform can
# ask over plain SSH without ansible in the path.
- name: Install the version probe
  ansible.builtin.copy:
    remote_src: true
    src: "{{ coord_checkout }}/bin/coord-version"
    dest: /usr/local/bin/coord-version
    mode: "0755"

# coord-sessions pipes its tar through the zstd CLI. Not a library: trixie ships
# Python 3.13 and stdlib zstd arrived in 3.14. Declared next to the tool that needs
# it rather than in bootstrap's prerequisites, where the reason would be invisible.
- name: Install zstd (the session packager compresses with it)
  ansible.builtin.apt:
    install_recommends: false
    name: zstd
    state: present
    update_cache: false

# Post-flight recovery's device half (#302). Installed the same way and for the
# same reason: `coord sessions` execs it, and the platform can also call it over
# plain SSH without ansible in the path.
- name: Install the session packager
  ansible.builtin.copy:
    remote_src: true
    src: "{{ coord_checkout }}/bin/coord-sessions"
    dest: /usr/local/bin/coord-sessions
    mode: "0755"

# The radio control (#434). Both roles: on the coordinator it refuses, having no
# gadget interface and so no way back in, which is the answer until a wired
# uplink is fitted.
- name: Install the radio control
  ansible.builtin.copy:
    remote_src: true
    src: "{{ coord_checkout }}/bin/coord-radio"
    dest: /usr/local/bin/coord-radio
    mode: "0755"

# The FC dataflash puller (#77). Same install, same reason -- but only where there
# is an FC to talk to: the campods have no serial link to one, so installing it
# there would advertise a verb that cannot work. It carries no deps of its own; it
# re-execs into the coordinator-mavlink image for pymavlink rather than putting
# that on the host.
- name: Install the FC dataflash puller
  ansible.builtin.copy:
    remote_src: true
    src: "{{ coord_checkout }}/bin/coord-fc-log"
    dest: /usr/local/bin/coord-fc-log
    mode: "0755"
  when: device_role == "coordinator"

# Fetch the images as part of convergence, not as a step somebody has to remember
# afterwards. This is what makes `coord start --pull never` safe: a converged node
# has its images by definition, so a missing one at boot means something is wrong
# rather than merely absent, and the boot unit can fail fast instead of starting an
# unattended fetch on a vehicle that may have no network (#269).
#
# Fetch only; the reboot at the end of the play brings the stack back.
#
# Slow and that is expected -- 4m22s measured for campod-camera on a Zero 2 W over
# WiFi, ~364 MB for the coordinator's four images.
#
# changed_when is a HEURISTIC on compose's progress output, which is not a stable
# interface. Nothing depends on it -- the reboot condition in site.yaml keys on the
# apt registers, not on these -- so a wrong reading here is cosmetic noise in the
# recap rather than a behaviour change. Said out loud so nobody later builds on it.
# Image names come from the units, which are the only place they appear.
- name: Pull the stack images
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      grep -h '^Image=' /opt/stacks/{{ coord_stack_name }}/*.container
      | cut -d= -f2- | sort -u
      | xargs -r -n1 podman pull --quiet
    executable: /bin/bash
  register: coord_stack_pull
  # podman pull prints the image id on a fetch and a cache hit alike, so there is
  # nothing to key "changed" on. Nothing downstream reads it.
  changed_when: false

# Deliberately NOT followed by a start. The converge ends by rebooting -- bootstrap
# remounts /usr read-write to do its work and that task is changed_when: true, so
# site.yaml's reboot condition is met on every run -- and the boot unit starts the
# stack on the way back up. The reboot is what restarts collection.
#
# Starting it here restarted capture in the MIDDLE of maintenance, with eighteen
# further tasks then competing with a pod writing full-resolution JPEGs to the same
# card. Starting the stack has itself been measured at 3m33s and 3m54s with a
# sustained ~20 MiB/s read storm (analysis/pi-zero-unresponsiveness-experiments.md),
# which is the last thing to introduce before the rest of the play runs. It also
# meant a converge left the device capturing, so the next converge began against a
# busy box instead of a quiet one.
#
# "Stop is not a sticky off" means the reboot brings it back, not that the play
# restarts it in place.
