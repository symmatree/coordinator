---
# Deliberate in-place OS upgrade for a Rekon device. Separate from site.yaml so a
# routine config deploy does NOT drag a full dist-upgrade and a reboot behind it
# (#48) -- run this only when you intend to move the OS forward.
#
# In the appliance model the OS version is a property of the flashed image (#96)
# and a reflash is the primary way to move it. This is the in-place alternative
# for a box you do not want to reflash yet.
#
#   ansible-playbook host/ansible/os-upgrade.yaml -i '10.0.2.49,' -u pi
#
# Was host/os_upgrade.sh. It is a playbook now for the same reason site.yaml is:
# the /usr hatch it needs is a task in roles/bootstrap rather than shell, and from
# outside we can reboot and wait instead of asking someone to.

- name: Rekon in-place OS upgrade
  hosts: all
  become: true
  vars:
    allow_reboot: true
    # roles/bootstrap also manages the checkout; not wanted here.
    manage_checkout: false

  roles:
    # For the /usr hatch. The prerequisite installs are idempotent no-ops on a
    # converged device.
    - role: bootstrap

  tasks:
    - name: Upgrade all packages
      # A dist-upgrade is far more likely than a fresh install to hit a debconf
      # prompt (maintainer scripts asking about changed conffiles), and there is no
      # tty on a pushed run. force_apt_get because the ansible apt module's default
      # aptitude path is not installed on these images.
      ansible.builtin.apt:
        upgrade: dist
        update_cache: true
        force_apt_get: true
      environment:
        DEBIAN_FRONTEND: noninteractive
      register: os_upgrade_dist

    - name: Remove packages no longer required
      ansible.builtin.apt:
        autoremove: true
        force_apt_get: true
      environment:
        DEBIAN_FRONTEND: noninteractive

  post_tasks:
    - name: Check whether a reboot is pending
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: os_upgrade_reboot_required

    - name: Reboot and wait for the device to come back
      # An OS upgrade almost always wants one, and /usr is writable until it happens.
      ansible.builtin.reboot:
        msg: Rekon OS upgrade -- applying kernel/firmware changes and restoring read-only /usr
      when:
        - allow_reboot | bool
        # ansible.builtin.reboot refuses under connection=local rather than
        # rebooting its own control node, and it would refuse at the LAST task --
        # after the device is already converged -- so the play would report failure
        # on a device that is fine. Skip instead and say so below.
        - ansible_connection | default('ssh') != 'local'
        - >-
          os_upgrade_reboot_required.stat.exists
          or (os_upgrade_dist is defined and os_upgrade_dist is changed)
