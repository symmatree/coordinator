---
# The routine converge: config, stack definition, and container images. Runs every
# time. Pair: provision.yaml, which installs the software and runs once per card.
#
#   ansible-playbook host/ansible/deploy.yaml -i '10.0.2.49,' -u pi \
#     -e device_role=campod
#
# Installs no packages. `git pull` is the deploy (#48); what is copied out of the
# checkout and what is symlinked into it: docs/deployment-model.md.
#
# Does not reboot and does not start the stack: the quiesce at the top leaves it
# stopped, and `coord start`, the fleet-control Reboot button or a power cycle is the
# operator's call.
#
# Tagged, so one playbook serves the different things a converge is for. Each tag pulls
# in what it needs, so any single one is a complete run:
#
#   --tags images        the checkout and the image pull -- a flight-line update
#   --tags tools         just /usr/local/bin (leaves /usr writable; see the hatch doc)
#   --tags stack         the state dirs, the quadlet units and the stack target
#   --tags metrics       just the collectd config
#   --tags checkout      just `git pull`
#   --skip-tags quiesce  converge against a device you want left running
#
# Verified by listing each selection; `--tags images` really is the pull and what it
# reads, because the device roles import coord-stack statically. See the roles list.

- name: Rekon config deploy
  hosts: all
  become: true
  # Off so the capture quiesce below runs FIRST. Automatic gathering happens before
  # pre_tasks, which meant the heaviest thing in the play ran while the payload was
  # still writing. Measured on campod-se 2026-09-15: coord-throttle-log missed six
  # firings, so the whole system stalled, and it began BEFORE the stop was invoked.
  gather_facts: false
  vars_files:
    - vars/gadget-net.yml
    - vars/payload.yml

  pre_tasks:
    - name: Refuse check mode
      ansible.builtin.fail:
        msg: >-
          This play does not support --check. Check mode skips the capture quiesce and
          the image pull, so it cannot validate what matters. Use --syntax-check.
      when: ansible_check_mode

    # FIRST, and with as little in front of it as possible. Capture and convergence
    # contend for the two things a Pi has least of -- the same SD card and, on a Zero,
    # the CPU. A campod converge that should take minutes took over an hour with the
    # capture container crash-looping beside it (#278).
    #
    # `raw` so ansible does not start python3.13 on the target to run it: on a box
    # whose failure mode is page-faulting large binaries, that startup costs more than
    # the command.
    #
    # Synchronous -- it returns when the units are down, or when their TimeoutStopSec
    # expires and systemd has killed them. The per-unit ceilings are in the quadlet
    # units.
    #
    # rc 5 is systemd for "no such unit", which is the first deploy onto a card that
    # has been provisioned but never deployed: the target is a symlink this play has
    # not made yet. Nothing to stop is success.
    - name: Stop data collection for the duration of the deploy
      tags: quiesce
      ansible.builtin.raw: systemctl stop {{ device_role }}-stack.target
      register: coord_stack_quiesced
      changed_when: coord_stack_quiesced.rc == 0
      failed_when: coord_stack_quiesced.rc not in [0, 1, 5]

    - name: Gather only the facts this playbook reads
      tags: always
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - architecture
          - distribution
          - platform

  roles:
    # /usr writable so host-cli can install the tools. It stays writable until the
    # next boot -- docs/deployment-model.md, "The /usr hatch". Tagged with its only
    # consumer, so a run that installs no tools does not open the hatch.
    - role: usr-rw
      tags: tools
    # Everything below reads from the checkout, so it carries their tags too.
    - role: checkout
      tags: [checkout, tools, stack, images]
    - role: host-cli
      tags: tools
    - role: metrics
      tags: metrics
    # Untagged on purpose: the device roles import coord-stack statically, so its tasks
    # are filtered by their own `stack` / `images` tags. A tag here would be inherited
    # by all of them and --tags images would pull the whole stack install with it.
    - role: coordinator
      when: device_role == 'coordinator'
    - role: campod
      when: device_role == 'campod'

  post_tasks:
    - name: Report what the device ended up in
      tags: always
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} deployed (device_role={{ device_role }}).
          The stack is stopped and /usr is writable until the next boot.
