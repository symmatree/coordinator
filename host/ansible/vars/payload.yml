---
# What gets installed on a device. The only list of it: roles/host-cli loops over
# host_tools, and .github/workflows/host-payload.yaml packs the same names, so the
# tarball and the converge cannot name different sets.
#
# bin/ holds more than this -- tests, a README, bench-only scripts. Those are not
# installed and do not belong in the payload.

host_tools:
  - coord
  - coord-fc-log
  - coord-radio
  - coord-sessions
  - coord-throttle-log
  - coord-version
  - vio-ipc-record
  - vio-pose-tap

# stacks/<role>/ goes in whole: roles/coord-stack symlinks the dir to /opt/stacks and
# installs every *.container plus the role's stack target.
stack_roles:
  - campod
  - coordinator
