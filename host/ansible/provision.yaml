---
# First-run setup: the software and the hardware wiring. Runs once per card, or once in
# a long while. Pair: deploy.yaml, which is the one that runs routinely.
#
#   ansible-playbook host/ansible/provision.yaml -i 'campod-se,' -u pi \
#     -e device_role=campod
#
# DRIVEN FROM ANOTHER MACHINE, over SSH. A freshly flashed card needs nothing installed
# on it first -- python3, sudo with passwordless and sshd are all in the image.
#
# What is here: packages, the /usr read-write hatch they need (roles/usr-rw), udev
# rules, masked getty and maintenance timers, the USB gadget link and the campod
# bridge. All of it is a property of the device rather than of a commit.
#
# In-place OS upgrade is off unless asked for:
#     ansible-playbook host/ansible/provision.yaml ... -e dist_upgrade=true
#
# No capture quiesce here. A card being provisioned has no stack, no containers and no
# capture to stop.

- name: Rekon first-run provisioning
  hosts: all
  become: true
  # Off so the heaviest thing in the play does not run before the cheap asserts.
  gather_facts: false
  vars_files:
    # The gadget-net contract, read by both device roles so the two halves cannot
    # drift apart. See the file for why it is not in each role's defaults.
    - vars/gadget-net.yml

  pre_tasks:
    # Check mode skips every command task, so it cannot exercise the half of this play
    # that matters, while still costing a full apt refresh and fact gather on a device
    # with no slack for it. --syntax-check is what a dry run is actually useful for.
    - name: Refuse check mode
      ansible.builtin.fail:
        msg: >-
          This play does not support --check. Use --syntax-check to validate
          structure, or run the play for real.
      when: ansible_check_mode

    # Only the facts this play reads. A full gather collects 99; the ones that touch
    # hardware (ansible_devices runs lsblk, ansible_mounts stats every mount) are the
    # plausible candidates for a stall on a 416 MB box with no swap.
    - name: Gather only the facts this playbook reads
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - architecture
          - distribution
          - platform

  roles:
    # First: who can log in. A card arrives trusting only the fleet management key, and
    # this is what grants the operator. Nothing below depends on it.
    - role: ssh-access
    # /usr writable for the package installs below; the reboot at the end closes it.
    - role: usr-rw
    - role: bootstrap
    - role: podman-host
    # Unconditional, both roles: they sit on the same power rail and the same SD
    # medium, so neither has a reason to be blind.
    - role: collectd-install
    # Appliance: nothing updates or maintains itself on a timer.
    - role: no-scheduled-maintenance
    - role: coordinator-hardware
      when: device_role == 'coordinator'
    # The blackfly is a camera pod on another board (a Radxa Zero 3W): same gadget link,
    # same console and power handling. The board's own device tree comes from its image.
    - role: campod-hardware
      when: device_role in ['campod', 'blackfly']

  post_tasks:
    # NO REBOOT. This play used to end with reboot-and-wait, which put it in the middle of
    # flash -> provision -> deploy: the slowest, most stateful thing in the sequence,
    # sitting where someone has to wait for a card to come back before the next play can
    # run. A reboot is the operator's: `POST /nodes/<name>/reboot`, when the whole sequence
    # is done.
    #
    # What that leaves undone until they take it: /usr stays writable (roles/usr-rw opened
    # it and only a boot restores ro), and the udev rules, module loads and gadget link a
    # fresh card needs are written but not applied. Said below rather than guarded, because
    # the next step is deploy, which neither needs nor minds either of those.
    - name: Report what the device ended up in
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} provisioned (device_role={{ device_role }}).
          NOT rebooted -- /usr is still writable and the udev rules, module loads and
          gadget link are written but not applied. Run deploy.yaml next, then reboot
          (`POST /nodes/{{ inventory_hostname }}/reboot`), which applies those and
          restores read-only /usr. Until deploy runs this device has no checkout and no
          stack.
