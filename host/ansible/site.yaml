---
# Host bootstrap and config convergence for Rekon devices. One entry point;
# device_role selects the device-specific role layered on the shared docker-host.
#
# DRIVEN FROM ANOTHER MACHINE, over SSH. A freshly flashed card needs nothing
# installed on it first -- python3, sudo with passwordless and sshd are all in the
# image -- so this works against a virgin unit:
#
#   ansible-playbook host/ansible/site.yaml -i '10.0.2.49,' -u pi \
#     -e device_role=campod
#
# A bare "address," is a valid inventory, so no inventory file and no DNS are
# required to run it. Pass a real -i inventory when driving more than one device.
#
# This replaced host/one_time.sh. That script existed because a device bootstrapping
# ITSELF cannot use ansible to install ansible, so the remount-then-apt ordering had
# to be survived in bash first. Driving from outside deletes that problem rather
# than working around it, which also removed host/lib/usr-rw.sh -- the /usr hatch is
# now a task in roles/bootstrap, ordered before the things that need it.
#
# In-place OS upgrade is off unless asked for:
#     ansible-playbook host/ansible/site.yaml ... -e dist_upgrade=true
# It used to be a separate playbook. One entry point, and the upgrade now inherits
# the capture quiesce and the --check refusal, which the separate playbook lacked.

- name: Rekon host bootstrap
  hosts: all
  become: true
  # Deliberately off, so the capture quiesce in pre_tasks runs FIRST. Automatic
  # gathering happens before pre_tasks, which meant the heaviest thing in the play
  # ran while the payload was still writing -- the opposite of the intended order.
  #
  # Measured on campod-se 2026-09-15: the converge's own startup coincided with a
  # whole-box stall. coord-throttle-log fires every 35s and logged at 15:00:10,
  # 15:00:45, 15:01:20, 15:01:55, 15:02:30, 15:03:05, 15:03:40 -- then nothing
  # until 15:07:33. A systemd timer missed six firings, so this is the whole
  # system stalling, and it began BEFORE `coord stop` was invoked at 15:04:10.
  # The three trivial stat tasks ahead of it took 21 seconds between them.
  #
  # Facts are gathered explicitly below, after the quiesce, and only the ones this
  # playbook reads.
  gather_facts: false
  vars_files:
    # The gadget-net contract, read by both device roles so the two halves cannot
    # drift apart. See the file for why it is not in each role's defaults.
    - vars/gadget-net.yml
  vars:
    device_role: coordinator

    # Only the PLAYBOOK comes from the control node. Everything else -- bin/coord,
    # the VIO tools, coord-throttle-log -- is copied from the TARGET's own checkout
    # with remote_src, so it can never be shipped independently of the stack config
    # it manages.
    #
    # The asymmetry is irreducible rather than untidy: you cannot fetch the playbook
    # from a target you have not cloned yet, and the playbook is what does the
    # cloning. Everything after the clone can and should come from the target.
    #
    # This also means the control node needs only host/ansible/**, not the repo --
    # which is what the cluster container has to carry.
    #
    # coord_repo_version is the hook for pinning: it floats at main today, and when
    # there are named releases worth pinning to, the control node clones a specified
    # version rather than whatever main happens to be.
    coord_checkout: "/home/{{ ansible_user | default('pi') }}/coordinator"


    # In-place `apt upgrade dist`. OFF by default: in the appliance model the OS
    # version is a property of the flashed image (#96) and a reflash is the primary
    # way to move it, so a routine config deploy must not drag a dist-upgrade and
    # its reboot behind it (#48). This is the in-place alternative for a box you do
    # not want to reflash yet -- run it deliberately, expect it to be slow.
    dist_upgrade: false
    coord_repo_url: https://github.com/symmatree/coordinator.git
    coord_repo_version: main

    # Was lookup('env','USER'), which resolves on the CONTROL NODE -- remotely that
    # would add the driver's username to the device's docker group.
    docker_users:
      - "{{ ansible_user | default('pi') }}"

    # From outside, ansible can reboot the target AND WAIT, so the old
    # "exit 1, reboot, run it again" dance collapses into one play. #113 had to
    # remove auto-reboot precisely because it ran locally, where ansible refuses to
    # reboot its own control node.
    allow_reboot: true

  pre_tasks:
    # Refuse --check rather than leaving it available and dangerous.
    #
    # Check mode skips every `command` task, which here is the quiesce below, the
    # image pull, the stack start, and every probe that registers a result and
    # keys off its rc. So a dry run cannot exercise the half of this play that
    # matters -- while still costing a full apt index refresh and fact gather on a
    # device that has no slack for it. Measured: a --check run on campod-se with
    # collection still up drove the box to stop servicing SSH for 20 minutes.
    #
    # The alternative was `check_mode: false` on the quiesce so a dry run stops
    # collection too. Rejected: the trailing `coord start` is also a command task
    # and would still skip, so --check would stop collection and leave it stopped.
    # Fixing that needs both tasks marked, and then any future edit to either one
    # reintroduces the half that leaves a pod dark.
    #
    # `--syntax-check` still validates structure and never connects to a device,
    # which is what a dry run is actually useful for here.
    - name: Refuse check mode
      ansible.builtin.fail:
        msg: >-
          This play does not support --check. Check mode skips every command task
          (the capture quiesce, the image pull, the stack start), so it cannot
          validate what matters, while still costing a full apt refresh on a Pi
          Zero -- which has been measured to make the device stop answering SSH.
          Use --syntax-check to validate structure, or run the play for real.
      when: ansible_check_mode

    # Stop data collection before converging, and let the converge have the
    # device to itself. A software update is a bench operation on wall power, so
    # the capture gap is intentional.
    #
    # Capture and convergence contend for the two things a Pi has least of. They
    # write to the same SD card -- the payload at ~1 Hz full-resolution JPEG plus
    # the accelerometer's 1 Hz fsync, against an image pull measured at 4m22s for
    # campod-camera alone -- and on a Zero 2 W they contend for CPU as well. A
    # campod converge that should take minutes took over an hour with the capture
    # container crash-looping beside it (#278).
    #
    # Nothing has to remember to put it back. `coord stop` is not a sticky off:
    # the boot unit's ExecStart=/usr/local/bin/coord start is unconditional (#256),
    # and both callers already end with a start of their own -- coord-stack's
    # final task, and fleet-control's actions.ts. So a converge that dies partway
    # leaves collection down only until the next power-up, and there is a power
    # cycle between bench and flight by construction. A sticky off would be the
    # wrong shape anyway: with no way to turn it back on, the failure mode is a
    # flight that silently recorded nothing.
    #
    # Skipped on a first converge -- the CLI and the stack symlink are installed
    # by the coord-stack role further down, and nothing is running to stop yet.
    - name: Stat the coord CLI
      ansible.builtin.stat:
        path: /usr/local/bin/coord
      register: coord_cli

    - name: Stat the stack compose file
      ansible.builtin.stat:
        path: "/opt/stacks/{{ device_role }}/compose.yaml"
      register: coord_stack_compose

    # COORD_STACK is passed explicitly rather than relying on coord's
    # sole-stack-under-/opt/stacks fallback, so this cannot start acting on the
    # wrong stack if a device ever has two installed.
    #
    # changed_when reads compose's progress output, which is not a stable
    # interface; a misread here is cosmetic recap noise only. Nothing keys on it,
    # and in particular the reboot decision does not.
    # Bounded, because unbounded is how this failed. On its first ever hardware
    # run (2026-09-15, campod-se) this task sat silent for 50+ minutes inside a
    # play the fleet driver deliberately runs with no overall ceiling, so the hang
    # held the node's slot indefinitely and reported nothing about itself.
    #
    # It is past its own internal bound by two orders of magnitude, which is what
    # makes it a hang rather than slowness: `coord stop` is `docker compose stop`,
    # and compose waits at most 10s per container before SIGKILL. Two containers
    # is ~20s worst case. So whatever is stuck is not the container's shutdown --
    # it is docker itself, and the likeliest way that happens is a container
    # process in uninterruptible sleep on I/O, where even SIGKILL cannot land and
    # the daemon waits forever.
    #
    # async/poll rather than a `timeout` wrapper so the failure names itself in
    # the recap instead of surfacing as a bare exit 124. 180s is generous against
    # a 20s worst case and still bounded.
    - name: Stop data collection for the duration of the converge
      ansible.builtin.command:
        cmd: /usr/local/bin/coord stop
      environment:
        COORD_STACK: "{{ device_role }}"
      async: 180
      poll: 5
      register: coord_stack_quiesced
      changed_when: >-
        'Stopping' in coord_stack_quiesced.stderr
        or 'Stopped' in coord_stack_quiesced.stderr
      when:
        - coord_cli.stat.exists
        - coord_stack_compose.stat.exists

    # Only the facts this playbook actually reads. Grepped, not guessed: the whole
    # play references exactly five gathered facts -- ansible_hostname,
    # ansible_os_family, ansible_distribution, ansible_distribution_release and
    # ansible_architecture. Everything else that looks like a fact
    # (ansible_user, ansible_connection, ansible_check_mode) is a connection or
    # magic var and needs no gathering at all.
    #
    # A full gather collects 99 facts; this collects 24 and all five are present.
    # The 75 we drop include the ones that actually touch hardware:
    # ansible_devices runs lsblk, ansible_mounts stats every mount -- and this card
    # carries seven btrfs subvolumes plus docker's overlays -- and the network
    # subset walks every veth and bridge docker has created. Those are the
    # plausible candidates for the stall above, on a 416 MB box with no swap.
    #
    # If a future task needs another fact, add its subset here. Ansible will fail
    # on the undefined variable rather than silently misbehave, which is the right
    # failure.
    - name: Gather only the facts this playbook reads
      ansible.builtin.setup:
        gather_subset:
          - '!all'
          - '!min'
          - architecture
          - distribution
          - platform

  roles:
    - role: bootstrap
    - role: docker-host
    # Unconditional, like docker-host: both device roles sit on the same power
    # rail and the same SD medium, so neither has a reason to be blind. Metrics
    # are written locally and copied off after a flight -- nothing scrapes them.
    - role: metrics
    # Appliance: nothing updates or maintains itself on a timer. Unconditional --
    # every device has the same short duty cycle and the same missed-window backlog.
    - role: no-scheduled-maintenance
    - role: coordinator
      when: device_role == 'coordinator'
    - role: campod
      when: device_role == 'campod'
  post_tasks:
    # Reboot when anything asked for one -- a kernel/firmware/module install, or
    # the /usr hatch this play opened. From outside we can reboot and wait, so the
    # device ends the play in the state it should be in rather than telling someone
    # to go and finish the job.
    - name: Check whether a reboot is pending
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: bootstrap_reboot_required

    # Reboot only when this run actually did something.
    #
    # The naive condition was "reboot if we remounted /usr", and /usr is read-only
    # on every boot, so that fires on EVERY run -- meaning a re-run against an
    # already-converged device would change nothing and then bounce the hardware.
    # For something a pre-flight button triggers, that is the wrong default.
    #
    # So: reboot if a package asked for one (reboot-required), or if we opened the
    # /usr hatch AND something was actually installed behind it. A genuine no-op
    # run leaves /usr writable until the next boot, which is the lesser cost --
    # and the next boot closes it regardless of whether anyone asks.
    - name: Reboot and wait for the device to come back
      ansible.builtin.reboot:
        msg: Rekon bootstrap -- applying kernel/firmware/module changes and restoring read-only /usr
      when:
        - allow_reboot | bool
        # ansible.builtin.reboot refuses under connection=local rather than
        # rebooting its own control node, and it would refuse at the LAST task --
        # after the device is already converged -- so the play would report failure
        # on a device that is fine. Skip instead and say so below.
        - ansible_connection | default('ssh') != 'local'
        # Reboot if a package asked for one, OR if we opened the /usr hatch --
        # which in practice means every run, because /usr comes back read-only at
        # every boot so the remount always fires. That is deliberate.
        #
        # This used to additionally require that apt had actually installed
        # something, to avoid rebooting a no-op converge. Measured consequence on
        # campod-se: the apply installed nothing, so no reboot fired, so /usr was
        # left WRITABLE with no marker and no warning -- while the bootstrap role's
        # own message said "the reboot at the end of this play restores it". The
        # invariant silently did not hold and the operator was told it did.
        #
        # Rebooting every converge is cheaper than an invariant that is true only
        # conditionally, and a converge is a bench operation anyway.
        - >-
          bootstrap_reboot_required.stat.exists
          or (bootstrap_usr_remount is defined and bootstrap_usr_remount is changed)

    - name: Report what the device ended up in
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} converged (device_role={{ device_role }}).
          {% if allow_reboot | bool and ansible_connection | default('ssh') != 'local' %}
          Rebooted, which is what restores read-only /usr; the boot unit brings the
          stack back up.
          {% else %}
          NOT rebooted{% if ansible_connection | default('ssh') == 'local' %} (connection is local, so ansible will not
          reboot its own control node){% endif %} -- reboot manually if /usr must return to
          read-only or a kernel change is pending.
          {% endif %}
