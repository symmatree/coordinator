---
# A fresh card, end to end: provision then deploy.
#
#   ansible-playbook host/ansible/site.yaml -i '10.0.2.49,' -u pi \
#     -e device_role=campod
#
# For a device that is already provisioned -- which is every device, after its first
# run -- use deploy.yaml instead. It installs nothing, opens no /usr hatch and does not
# reboot, so it is the one that is cheap to run between flights.

- import_playbook: provision.yaml
- import_playbook: deploy.yaml
