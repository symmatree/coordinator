---
# Host bootstrap and config convergence for Rekon devices. One entry point;
# device_role selects the device-specific role layered on the shared docker-host.
#
# DRIVEN FROM ANOTHER MACHINE, over SSH. A freshly flashed card needs nothing
# installed on it first -- python3, sudo with passwordless and sshd are all in the
# image -- so this works against a virgin unit:
#
#   ansible-playbook host/ansible/site.yaml -i '10.0.2.49,' -u pi \
#     -e device_role=campod -e manage_checkout=true -e sync_repo=true
#
# A bare "address," is a valid inventory, so no inventory file and no DNS are
# required to run it. Pass a real -i inventory when driving more than one device.
#
# This replaced host/one_time.sh. That script existed because a device bootstrapping
# ITSELF cannot use ansible to install ansible, so the remount-then-apt ordering had
# to be survived in bash first. Driving from outside deletes that problem rather
# than working around it, which also removed host/lib/usr-rw.sh -- the /usr hatch is
# now a task in roles/bootstrap, ordered before the things that need it.
#
# In-place OS upgrade is a separate deliberate playbook: host/ansible/os-upgrade.yaml.

- name: Rekon host bootstrap
  hosts: all
  become: true
  vars_files:
    # The gadget-net contract, read by both device roles so the two halves cannot
    # drift apart. See the file for why it is not in each role's defaults.
    - vars/gadget-net.yml
  vars:
    device_role: coordinator
    sync_repo: false

    # repo_root used to serve two purposes with one value, and only one of them
    # survives a remote run:
    #
    #   * SOURCE for `copy` tasks (bin/coord, the VIO tools), which read from the
    #     CONTROL NODE. Remotely this is better, not merely fine -- the CLIs get
    #     pushed from the driver's checkout rather than depending on whatever the
    #     device happens to have cloned.
    #   * SYMLINK TARGET for /opt/stacks/<role>, which must be a path that exists
    #     ON THE DEVICE. With one value a remote run points /opt/stacks/coordinator
    #     at a directory on the driver.
    #
    # So they are two variables now.
    repo_src: "{{ playbook_dir | dirname | dirname }}"
    coord_checkout: "/home/{{ ansible_user | default('pi') }}/coordinator"

    # Creating the checkout is what removes the last bootstrap ordering problem.
    # Off by default so an operator's working tree is never reset under them.
    manage_checkout: false
    coord_repo_url: https://github.com/symmatree/coordinator.git
    coord_repo_version: main

    # Was lookup('env','USER'), which resolves on the CONTROL NODE -- remotely that
    # would add the driver's username to the device's docker group.
    docker_users:
      - "{{ ansible_user | default('pi') }}"

    # From outside, ansible can reboot the target AND WAIT, so the old
    # "exit 1, reboot, run it again" dance collapses into one play. #113 had to
    # remove auto-reboot precisely because it ran locally, where ansible refuses to
    # reboot its own control node.
    allow_reboot: true

  pre_tasks:
    # Stop data collection before converging, and let the converge have the
    # device to itself. A software update is a bench operation on wall power, so
    # the capture gap is intentional.
    #
    # Capture and convergence contend for the two things a Pi has least of. They
    # write to the same SD card -- the payload at ~1 Hz full-resolution JPEG plus
    # the accelerometer's 1 Hz fsync, against an image pull measured at 4m22s for
    # campod-camera alone -- and on a Zero 2 W they contend for CPU as well. A
    # campod converge that should take minutes took over an hour with the capture
    # container crash-looping beside it (#278).
    #
    # Nothing has to remember to put it back. `coord stop` is not a sticky off:
    # the boot unit's ExecStart=/usr/local/bin/coord start is unconditional (#256),
    # and both callers already end with a start of their own -- coord-stack's
    # final task, and fleet-control's actions.ts. So a converge that dies partway
    # leaves collection down only until the next power-up, and there is a power
    # cycle between bench and flight by construction. A sticky off would be the
    # wrong shape anyway: with no way to turn it back on, the failure mode is a
    # flight that silently recorded nothing.
    #
    # Skipped on a first converge -- the CLI and the stack symlink are installed
    # by the coord-stack role further down, and nothing is running to stop yet.
    - name: Stat the coord CLI
      ansible.builtin.stat:
        path: /usr/local/bin/coord
      register: coord_cli

    - name: Stat the stack compose file
      ansible.builtin.stat:
        path: "/opt/stacks/{{ device_role }}/compose.yaml"
      register: coord_stack_compose

    # COORD_STACK is passed explicitly rather than relying on coord's
    # sole-stack-under-/opt/stacks fallback, so this cannot start acting on the
    # wrong stack if a device ever has two installed.
    #
    # changed_when reads compose's progress output, which is not a stable
    # interface; a misread here is cosmetic recap noise only. Nothing keys on it,
    # and in particular the reboot decision does not.
    - name: Stop data collection for the duration of the converge
      ansible.builtin.command:
        cmd: /usr/local/bin/coord stop
      environment:
        COORD_STACK: "{{ device_role }}"
      register: coord_stack_quiesced
      changed_when: >-
        'Stopping' in coord_stack_quiesced.stderr
        or 'Stopped' in coord_stack_quiesced.stderr
      when:
        - coord_cli.stat.exists
        - coord_stack_compose.stat.exists

  roles:
    - role: bootstrap
    - role: docker-host
    # Unconditional, like docker-host: both device roles sit on the same power
    # rail and the same SD medium, so neither has a reason to be blind. Metrics
    # are written locally and copied off after a flight -- nothing scrapes them.
    - role: metrics
    # Appliance: nothing updates or maintains itself on a timer. Unconditional --
    # every device has the same short duty cycle and the same missed-window backlog.
    - role: no-scheduled-maintenance
    - role: coordinator
      when: device_role == 'coordinator'
    - role: campod
      when: device_role == 'campod'
  post_tasks:
    # Reboot when anything asked for one -- a kernel/firmware/module install, or
    # the /usr hatch this play opened. From outside we can reboot and wait, so the
    # device ends the play in the state it should be in rather than telling someone
    # to go and finish the job.
    - name: Check whether a reboot is pending
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: bootstrap_reboot_required

    # Reboot only when this run actually did something.
    #
    # The naive condition was "reboot if we remounted /usr", and /usr is read-only
    # on every boot, so that fires on EVERY run -- meaning a re-run against an
    # already-converged device would change nothing and then bounce the hardware.
    # For something a pre-flight button triggers, that is the wrong default.
    #
    # So: reboot if a package asked for one (reboot-required), or if we opened the
    # /usr hatch AND something was actually installed behind it. A genuine no-op
    # run leaves /usr writable until the next boot, which is the lesser cost --
    # and the next boot closes it regardless of whether anyone asks.
    - name: Reboot and wait for the device to come back
      ansible.builtin.reboot:
        msg: Rekon bootstrap -- applying kernel/firmware/module changes and restoring read-only /usr
      when:
        - allow_reboot | bool
        # ansible.builtin.reboot refuses under connection=local rather than
        # rebooting its own control node, and it would refuse at the LAST task --
        # after the device is already converged -- so the play would report failure
        # on a device that is fine. Skip instead and say so below.
        - ansible_connection | default('ssh') != 'local'
        - >-
          bootstrap_reboot_required.stat.exists
          or (
            (bootstrap_usr_remount is defined and bootstrap_usr_remount is changed)
            and (
              (bootstrap_prereqs is defined and bootstrap_prereqs is changed)
              or (docker_host_pkgs is defined and docker_host_pkgs is changed)
            )
          )

    - name: Report what the device ended up in
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} converged (device_role={{ device_role }}).
          {% if allow_reboot | bool and ansible_connection | default('ssh') != 'local' %}
          Rebooted if anything actually changed or a package asked for it; the boot
          unit brings the stack back up. A no-op run does NOT reboot, and leaves
          /usr writable until the next boot.
          {% else %}
          NOT rebooted{% if ansible_connection | default('ssh') == 'local' %} (connection is local, so ansible will not
          reboot its own control node){% endif %} -- reboot manually if /usr must return to
          read-only or a kernel change is pending.
          {% endif %}
